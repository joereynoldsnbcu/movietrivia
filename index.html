', maximumFractionDigits:1 }); }catch(e){ return JA_NUM; } })();\nfunction fmtNum(n){ return Math.abs(n) >= 10000 ? JA_COMPACT.format(n) : JA_NUM.format(n); }   /* 1万以上は「1.2万」「3億」表記 */\nfunction dayLabel(n){ return n + '日目'; }\nfunction fmtTimeJa(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60), r = s % 60; return (m ? m + '分' : '') + r + '秒'; }\n/* ======================================================================\n   CINEMANIAC - Universal+ daily themed trivia round (embedded data)\n   - One themed round of 10 questions per day.\n   - Themes are dealt in a shuffled order; every theme is used once before\n     any theme repeats. Question order and answer positions are reshuffled\n     each day, so a repeated theme never plays out identically.\n   ====================================================================== */\nconst TRIVIA = /*TRIVIA_DATA*/null;\nconst UMG_HOST = /*UMG_HOST*/null || { protocol: location.protocol, url: location.href };\nconst IS_TV = !!UMG_HOST.tv || /SMART-TV|SmartTV|Tizen|Web0S|webOS|WebOS|NetCast|LG Browser|HbbTV|BRAVIA|Sony|CrKey|GoogleTV|Google TV|Android TV|AndroidTV|AFT[A-Z]|Roku|VIDAA|Viera|Panasonic|AQUOS|Sharp|PhilipsTV|Philips|TPV|Hisense|Vizio|Opera TV|OMI|Vewd|Titan|Freeview|\\bTV\\b/i.test(navigator.userAgent);\n/* ---------- Input mode: show focus rings for remotes/keyboards, hide them for touch/mouse ---------- */\n(function(){\n  var root = document.documentElement;\n  if(IS_TV) root.classList.add('tv', 'kbd');\n  document.addEventListener('keydown', function(e){\n    if(/^(Arrow|Enter|Tab|Up|Down|Left|Right)/.test(e.key || '') || (e.keyCode >= 37 && e.keyCode \u003c= 40) || e.keyCode === 13) root.classList.add('kbd');\n  }, true);\n  document.addEventListener('pointerdown', function(e){ if(!IS_TV && e.pointerType) root.classList.remove('kbd'); }, true);\n})();\n\n/* Back button on every remote: Samsung Tizen (10009), LG webOS (461), Android/Fire TV, keyboards */\nvar BACK_KEYS = ['Escape','BrowserBack','GoBack','Back','XF86Back','Backspace'];\nvar BACK_CODES = [10009, 461, 166, 27, 8];\nfunction isBackKey(e){ return BACK_KEYS.indexOf(e.key) !== -1 || BACK_CODES.indexOf(e.keyCode) !== -1; }\n/* ---------- TV remotes: some TV browsers send old key names / codes; normalise them ---------- */\nvar KEY_ALIAS = { Left:'ArrowLeft', Up:'ArrowUp', Right:'ArrowRight', Down:'ArrowDown' };\nvar KEY_CODES = { 37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 13:'Enter' };\nfunction normKey(e){\n  var k = e.key;\n  if(KEY_ALIAS[k]) return KEY_ALIAS[k];\n  if((!k || k === 'Unidentified') && KEY_CODES[e.keyCode]) return KEY_CODES[e.keyCode];\n  return null;\n}\nfunction synthKey(target, k, code){\n  var ev;\n  try{ ev = new KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true }); }\n  catch(x){ ev = document.createEvent('Event'); ev.initEvent('keydown', true, true); try{ Object.defineProperty(ev, 'key', { get:function(){ return k; } }); }catch(y){} }\n  try{ Object.defineProperty(ev, 'keyCode', { get:function(){ return code || 0; } }); }catch(x){}\n  ev.umgSynthetic = true;\n  (target || document.body).dispatchEvent(ev);\n}\n\nfunction firstButton(){\n  var l = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'))\n    .filter(function(b){ return b.offsetParent !== null; });\n  return l[0] || null;\n}\nfunction fireKey(k, code){\n  document.documentElement.classList.add('kbd');\n  var t = document.activeElement;\n  if(!t || t === document.body || t === document.documentElement){\n    var f = firstButton();\n    if(f){ try{ f.focus({ preventScroll:true }); }catch(x){ f.focus(); } if(/^Arrow/.test(k)) return; t = f; }\n  }\n  if(k === 'Enter'){ if(t && t.tagName === 'BUTTON' && !t.disabled) t.click(); return; }\n  synthKey(t, k, code);\n}\nwindow.addEventListener('keydown', function(e){\n  if(e.umgSynthetic) return;\n  if(e.key === 'm' || e.key === 'M'){ try{ parent.postMessage({ umg:'music' }, '*'); }catch(x){} return; }\n  var k = normKey(e); if(!k) return;\n  e.preventDefault(); e.stopImmediatePropagation();\n  fireKey(k, e.keyCode);\n}, true);\n/* Keys pressed while the TV gave focus to the hub page are forwarded here */\nwindow.addEventListener('message', function(e){\n  var d = e.data || {}; if(d.umg !== 'key') return;\n  var k = KEY_ALIAS[d.key] || d.key;\n  if((!k || k === 'Unidentified') && KEY_CODES[d.code]) k = KEY_CODES[d.code];\n  if(k) fireKey(k, d.code);\n});\n/* Let the hub know about taps/presses here so it can start the video and music (browsers need a gesture) */\n(function(){\n  var last = 0;\n  function g(){ var n = Date.now(); if(n - last \u003c 800) return; last = n; try{ parent.postMessage({ umg:'gesture' }, '*'); }catch(x){} }\n  ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, g, { capture:true, passive:true }); });\n})();\n\n\nconst START_DATE = '2026-10-01';\nconst STORE_KEY  = 'umg.trivia.v1';\nconst SECONDS    = 20;\nconst BASE_PTS   = 100;\nconst SPEED_PTS  = 100;\n\n/* ---------- Dates ---------- */\nconst MS_DAY = 86400000;\nconst localMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();\nconst parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getTime(); };\nconst toISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\nconst dayNumberFor = d => Math.round((localMidnight(d) - parseISO(START_DATE)) / MS_DAY) + 1;\nconst dateForDay = n => { const b = new Date(parseISO(START_DATE)); return new Date(b.getFullYear(), b.getMonth(), b.getDate() + n - 1); };\nconst isoForDay  = n => toISO(dateForDay(n));\nconst longDate = d => JA_LONG.format(d);\n\n/* ---------- Seeded schedule ---------- */\nfunction mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);\n  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction shuffle(arr, r){ for(let i = arr.length - 1; i > 0; i--){ const j = r() * (i + 1) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }\nconst THEMES = TRIVIA.themes.filter(t => Array.isArray(t.questions) && t.questions.length);\nconst roundCache = {};\nfunction roundForDay(n){\n  if(roundCache[n]) return roundCache[n];\n  const L = THEMES.length, cyc = Math.floor((n - 1) / L), pos = ((n - 1) % L + L) % L;\n  const order = shuffle(THEMES.map((_, i) => i), mulberry(0x7A1B1A ^ (cyc * 104729 + 3)));\n  const theme = THEMES[order[pos]];\n  const r = mulberry((n * 2654435761) ^ 0x51CE77);\n  const qs = shuffle(theme.questions.slice(), r).map(q => {\n    const perm = shuffle([1,2,3,4], r);                 // new answer positions each day\n    return [q[0], q[perm[0]], q[perm[1]], q[perm[2]], q[perm[3]], perm.indexOf(Number(q[5])) + 1];\n  });\n  return (roundCache[n] = { theme: theme.theme, questions: qs });\n}\n\n/* ---------- Storage ---------- */\nconst blankStore = () => ({ results:{}, progress:{}, streak:0, best:0, lastPlayedISO:null });\nfunction loadStore(){\n  try{ const raw = localStorage.getItem(STORE_KEY); return raw ? Object.assign(blankStore(), JSON.parse(raw)) : blankStore(); }\n  catch(e){ return blankStore(); }\n}\nfunction saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }\nfunction displayStreak(){\n  if(!store.lastPlayedISO) return 0;\n  const y = toISO(new Date(parseISO(todayISO) - MS_DAY));\n  return (store.lastPlayedISO === todayISO || store.lastPlayedISO === y) ? store.streak : 0;\n}\n\n/* ---------- State ---------- */\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst today = new Date(), todayISO = toISO(today);\nconst todayDay = Math.max(1, dayNumberFor(today));\nlet store = loadStore();\nlet active = null;    // { day, iso, isToday, round, answers:[{pick,correct,pts}], replay }\nlet qIndex = 0, qStart = 0, timerRaf = null, locked = false, countdownId = null;\nconst isTouch = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;\nfunction softFocus(el){ if(!el || (isTouch && !IS_TV)) return; try{ el.focus({ preventScroll:true }); }catch(e){} }\nfunction toTop(el){ if(!el) return; el.scrollTop = 0; setTimeout(() => { el.scrollTop = 0; }, 150); setTimeout(() => { el.scrollTop = 0; }, 450); }\n\n/* ---------- Landing ---------- */\nfunction allResults(){ return Object.keys(store.results).map(k => store.results[k]); }\nfunction paintLanding(){\n  const r = allResults();\n  $('#landingDate').textContent = longDate(today);\n  $('#landingTheme').textContent = '\\u{1F3AC} 今日のテーマ：' + roundForDay(todayDay).theme;\n  $('#statStreak').textContent = displayStreak();\n  $('#statBest').textContent = store.best;\n  $('#statPerfect').textContent = r.filter(x => x.correct === x.total).length;\n  $('#statAvg').textContent = r.length ? JA_NUM.format(Math.round(r.reduce((a, x) => a + x.correct, 0) / r.length * 10) / 10) : '0';\n  const done = store.results[todayISO], part = store.progress[todayISO];\n  if(done){\n    $('#startBtn').textContent = '今日の結果を見る';\n    $('#landingTag').textContent = '今日は' + done.total + '問中' + done.correct + '問正解でした。次のクイズは深夜0時に公開です。';\n  }else if(part){\n    $('#startBtn').textContent = '続きからプレイ';\n    $('#landingTag').textContent = '途中まで進んでいます。続きをどうぞ！';\n  }else{\n    $('#startBtn').textContent = '今日のクイズに挑戦';\n    $('#landingTag').textContent = '1日10問の映画クイズ。毎日新しいテーマをお届けします。';\n  }\n}\n\n/* ---------- Screens ---------- */\nfunction show(id){\n  document.body.classList.toggle('on-landing', id === 'landing');   // footer only on the landing page\n  ['landing','game','archive'].forEach(s => {\n    const el = $('#' + s);\n    if(s === id){ el.classList.remove('hidden-left','hidden-right'); }\n    else if(!el.classList.contains('hidden-left') && !el.classList.contains('hidden-right')){\n      el.classList.add(s === 'landing' ? 'hidden-left' : 'hidden-right');\n    }\n  });\n  toTop($('#' + id));\n}\n\n/* ---------- Round flow ---------- */\nfunction openDay(n, replay){\n  clearInterval(countdownId); cancelAnimationFrame(timerRaf);\n  const iso = isoForDay(n);\n  active = { day:n, iso:iso, isToday:n === todayDay, round:roundForDay(n), replay:!!replay,\n             answers: replay ? [] : (store.progress[iso] || []).slice() };\n  $('#roundName').textContent = active.round.theme;\n  $('#roundSub').textContent = '第' + n + '回';\n  const flag = $('#archiveFlag');\n  flag.classList.toggle('on', !active.isToday);\n  flag.textContent = active.isToday ? '' : '\\u{1F4FC} 過去の回・' + longDate(dateForDay(n)) + '・連続日数には影響しません';\n  $('#replayFlag').classList.toggle('on', !!replay);\n  show('game');\n  if(!replay && store.results[iso]){ active.answers = store.results[iso].answers; showResults(); }\n  else { qIndex = active.answers.length; if(qIndex >= active.round.questions.length) finishRound(); else showQuestion(); }\n}\nfunction paintDots(){\n  $('#dots').innerHTML = active.round.questions.map((_, i) => {\n    const a = active.answers[i];\n    return '\u003cspan class=\"dot' + (a ? (a.correct ? ' ok' : ' bad') : (i === qIndex ? ' now' : '')) + '\">\u003c/span>';\n  }).join('');\n  const pts = active.answers.reduce((s, a) => s + a.pts, 0);\n  $('#scoreBox').innerHTML = fmtNum(pts) + '\u003csmall>ポイント\u003c/small>';\n}\nfunction showQuestion(){\n  locked = false;\n  const q = active.round.questions[qIndex];\n  paintDots();\n  $('.timebar').style.visibility = 'visible';\n  $('#playArea').innerHTML =\n    '\u003cdiv class=\"qcard\">\u003cdiv class=\"qnum\">第' + (qIndex+1) + '問／全' + active.round.questions.length + '問\u003c/div>' +\n    '\u003cp class=\"qtext\">' + esc(q[0]) + '\u003c/p>\u003c/div>' +\n    '\u003cdiv class=\"options\">' + [1,2,3,4].map(i =>\n      '\u003cbutton class=\"opt\" type=\"button\" data-i=\"' + i + '\">\u003cspan class=\"key\">' + 'ABCD'[i-1] + '\u003c/span>' + esc(q[i]) + '\u003c/button>').join('') +\n    '\u003c/div>\u003cdiv class=\"feedback\" id=\"feedback\">\u003c/div>\u003cdiv class=\"nextrow\" id=\"nextRow\">\u003c/div>';\n  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(Number(b.dataset.i))));\n  toTop($('#game'));\n  setTimeout(() => softFocus(document.querySelector('.opt')), 250);\n  startTimer();\n}\nfunction startTimer(){\n  cancelAnimationFrame(timerRaf);\n  qStart = performance.now();\n  const fill = $('#timeFill');\n  const tick = now => {\n    const left = Math.max(0, 1 - (now - qStart) / (SECONDS * 1000));\n    fill.style.transform = 'scaleX(' + left + ')';\n    if(left \u003c= 0){ answer(0); return; }\n    if(!locked) timerRaf = requestAnimationFrame(tick);\n  };\n  timerRaf = requestAnimationFrame(tick);\n}\nconst CHEERS = ['正解！','おみごと！','さすがです！','ナイスです！','いい調子です！','その調子！'];\nconst OOPS   = ['おしい！','あと一歩でした！','惜しかったですね。','ドンマイです！','次はきっと大丈夫！'];\nconst pick = arr => arr[Math.floor(Math.random() * arr.length)];\nfunction answer(choice){\n  if(locked || !active) return;\n  locked = true;\n  cancelAnimationFrame(timerRaf);\n  const q = active.round.questions[qIndex], right = Number(q[5]);\n  const used = Math.min(1, (performance.now() - qStart) / (SECONDS * 1000));\n  const correct = choice === right;\n  const pts = correct ? BASE_PTS + Math.round(SPEED_PTS * (1 - used)) : 0;\n  active.answers.push({ pick:choice, correct:correct, pts:pts });\n  if(!active.replay){ store.progress[active.iso] = active.answers; saveStore(); }\n  document.querySelectorAll('.opt').forEach(b => {\n    const i = Number(b.dataset.i);\n    b.disabled = true;\n    if(i === right) b.classList.add('right');\n    else if(i === choice) b.classList.add('wrong');\n    else b.classList.add('dim');\n  });\n  const fb = $('#feedback');\n  fb.className = 'feedback ' + (correct ? 'ok' : 'bad');\n  fb.textContent = correct ? pick(CHEERS) + ' +' + fmtNum(pts) : (choice === 0 ? '時間切れです。' : pick(OOPS) + ' ') + '正解は「' + q[right] + '」でした。';\n  paintDots();\n  const last = qIndex === active.round.questions.length - 1;\n  $('#nextRow').innerHTML = '\u003cbutton id=\"nextBtn\" class=\"btn primary btn-lg\" type=\"button\">' + (last ? '結果を見る' : '次の問題へ') + '\u003c/button>';\n  $('#nextBtn').addEventListener('click', next);\n  softFocus($('#nextBtn'));\n}\nfunction next(){\n  qIndex++;\n  if(qIndex >= active.round.questions.length) finishRound(); else showQuestion();\n}\nfunction summary(ans, total){\n  return { answers:ans, correct:ans.filter(a => a.correct).length, total:total, points:ans.reduce((s, a) => s + a.pts, 0) };\n}\nfunction finishRound(){\n  const total = active.round.questions.length;\n  const sum = summary(active.answers, total);\n  if(active.replay){ active.replaySummary = sum; }\n  else if(!store.results[active.iso]){\n    if(active.isToday){\n      const y = toISO(new Date(parseISO(active.iso) - MS_DAY));\n      store.streak = (store.lastPlayedISO === y && store.streak > 0) ? store.streak + 1 : 1;\n      store.best = Math.max(store.best, store.streak);\n      store.lastPlayedISO = active.iso;\n    }\n    store.results[active.iso] = Object.assign({ round:active.round.theme, archive:!active.isToday }, sum);\n    delete store.progress[active.iso];\n    saveStore();\n  }\n  showResults();\n  if(sum.correct === total) confetti();\n}\nfunction showResults(){\n  cancelAnimationFrame(timerRaf);\n  const r = active.replay ? active.replaySummary : store.results[active.iso];\n  qIndex = r.total;\n  paintDots();\n  $('.timebar').style.visibility = 'hidden';\n  const stars = r.correct >= r.total ? 3 : r.correct >= 7 ? 2 : r.correct >= 5 ? 1 : 0;\n  const verdict = ['おつかれさまでした！また明日、挑戦してみてください。', 'ナイスチャレンジ！その調子です。', 'すばらしい！あと少しで満点です。', '全問正解！おみごとです。'][stars];\n  const review = active.round.questions.map((q, i) => {\n    const a = r.answers[i] || { pick:0, correct:false };\n    return '\u003cdiv>' + (a.correct ? '\u003cspan class=\"t\">○\u003c/span> ' : '\u003cspan class=\"x\">×\u003c/span> ') + esc(q[0]) +\n      ' \u003cb>' + esc(q[Number(q[5])]) + '\u003c/b>\u003c/div>';\n  }).join('');\n  const streak = displayStreak();\n  const banner = active.replay ? '\\u{1F501} リプレイ・最初の成績はそのまま残ります'\n    : active.isToday ? '\\u{1F525} ' + streak + '日連続・最高記録 ' + store.best + '日'\n    : '\\u{1F4FC} 過去の回・連続日数はそのままです';\n  $('#playArea').innerHTML =\n    '\u003cdiv class=\"result-card\">' +\n      '\u003cdiv class=\"big-score\">' + r.correct + '\u003csmall style=\"font-size:.35em\">／' + r.total + '問\u003c/small>\u003c/div>' +\n      '\u003cdiv class=\"stars\">' + '\\u2B50'.repeat(stars) + '\u003cspan style=\"opacity:.25\">' + '\\u2B50'.repeat(3 - stars) + '\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"verdict\">' + verdict + '\u003c/div>' +\n      '\u003cdiv class=\"points\">' + fmtNum(r.points) + ' ポイント\u003c/div>' +\n      '\u003cdiv class=\"banner\">' + banner + '\u003c/div>' +\n      '\u003cdiv class=\"actions\">' +\n        '\u003cbutton id=\"shareBtn\" class=\"btn pink\" type=\"button\">結果をシェア\u003c/button>' +\n        '\u003cbutton id=\"againBtn\" class=\"btn\" type=\"button\">もう一度遊ぶ\u003c/button>' +\n        '\u003cbutton id=\"arcBtn\" class=\"btn\" type=\"button\">過去のクイズ\u003c/button>' +\n        '\u003cbutton id=\"homeBtn\" class=\"btn primary\" type=\"button\">ホーム\u003c/button>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"social\">\u003cbutton id=\"lineBtn\" class=\"btn line\" type=\"button\">LINEで送る\u003c/button>\u003cbutton id=\"xBtn\" class=\"btn xpost\" type=\"button\">Xでポスト\u003c/button>\u003c/div>' +\n      '\u003ca class=\"unext\" href=\"https://video.unext.jp/brand/universal-plus\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"U-NEXTでUniversal+を観る（新しいタブで開きます）\">\u003cimg src=\"logo_white.png\" alt=\"Universal+\" onerror=\"this.style.display=\\'none\\'\">\u003cspan class=\"unext-txt\">\u003cb>U-NEXTでUniversal+を観る\u003c/b>\u003csmall>配信中の作品をチェック\u003c/small>\u003c/span>\u003cspan class=\"unext-arrow\" aria-hidden=\"true\">&rarr;\u003c/span>\u003c/a>' +\n      '\u003cdiv class=\"review\">' + review + '\u003c/div>' +\n      (active.isToday ? '\u003cp class=\"next-in\">次のクイズまで \u003cspan id=\"countdown\">--:--:--\u003c/span>\u003c/p>' : '') +\n    '\u003c/div>';\n  $('#shareBtn').addEventListener('click', share);\n  bindSocial('lineBtn', 'xBtn', resultShareText);\n  $('#againBtn').addEventListener('click', () => openDay(active.day, true));\n  $('#arcBtn').addEventListener('click', openArchive);\n  $('#homeBtn').addEventListener('click', goHome);\n  if(active.isToday) startCountdown();\n  toTop($('#game'));\n  setTimeout(() => softFocus($('#shareBtn')), 300);\n}\n\n/* ---------- Share ---------- */\nfunction resultText(day, round, r){\n  const grid = r.answers.map(a => a.correct ? '\\u2B55' : '\\u274C').join('');\n  return 'シネマニアック #' + day + '\\n' + round.theme + '\\n' +\n         r.total + '問中' + r.correct + '問正解・' + fmtNum(r.points) + 'ポイント\\n' + grid;\n}\nfunction sendShare(text, btnId, label){\n  var web = /^https?:$/.test(UMG_HOST.protocol);\n  var payload = web ? text + '\\n' + UMG_HOST.url : text;\n  function legacyCopy(){\n    try{\n      var ta = document.createElement('textarea');\n      ta.value = payload; ta.setAttribute('readonly','');\n      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';\n      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, payload.length);\n      var ok = document.execCommand('copy'); document.body.removeChild(ta);\n      if(ok){ flash(btnId, label); return; }\n    }catch(e){}\n    window.prompt('コピーしてシェアしてください：', payload);\n  }\n  function clip(){\n    if(navigator.clipboard && window.isSecureContext){\n      navigator.clipboard.writeText(payload).then(function(){ flash(btnId, label); }, legacyCopy);\n    }else legacyCopy();\n  }\n  if(navigator.share && web){\n    navigator.share({ title:'シネマニアック', text:text, url:UMG_HOST.url }).catch(function(err){ if(!err || err.name !== 'AbortError') clip(); });\n    return;\n  }\n  clip();\n}\nfunction share(){ const t = resultShareText(); if(t) sendShare(t, '#shareBtn', '結果をシェア'); }\nfunction resultShareText(){\n  const r = active.replay ? active.replaySummary : store.results[active.iso]; if(!r) return '';\n  return resultText(active.day, active.round, r) + (active.isToday && !active.replay ? '\\n\\u{1F525} ' + displayStreak() + '日連続' : '');\n}\nfunction shareLanding(){ sendShare(landingText(), '#landingShareBtn', 'シェア'); }\nfunction landingText(){\n  const r = store.results[todayISO], streak = displayStreak();\n  const text = r ? resultText(todayDay, roundForDay(todayDay), r) + (streak ? '\\n\\u{1F525} ' + streak + '日連続' : '')\n    : '\\u{1F3AC} シネマニアック #' + todayDay + '\\n今日のテーマ：' + roundForDay(todayDay).theme +\n      '\\n全10問の映画クイズ、いっしょに挑戦しませんか？' + (streak ? '\\n\\u{1F525} ' + streak + '日連続プレイ中' : '');\n  return text;\n}\nfunction flash(btnId, label){ const b = $(btnId); if(!b) return; b.textContent = 'コピーしました';\n  setTimeout(() => { const s = $(btnId); if(s) s.textContent = label; }, 2200); }\n\n/* ---------- Countdown / confetti ---------- */\nfunction startCountdown(){\n  clearInterval(countdownId);\n  const tick = () => {\n    const now = new Date(), diff = Math.max(0, localMidnight(now) + MS_DAY - now.getTime());\n    const el = $('#countdown');\n    if(el) el.textContent = [diff/3600000, diff%3600000/60000, diff%60000/1000].map(n => String(Math.floor(n)).padStart(2,'0')).join(':');\n  };\n  tick(); countdownId = setInterval(tick, 1000);\n}\nfunction confetti(){\n  const cols = ['#ffc83d','#ff4f9a','#33d6ff','#22c97a','#9b7bff'];\n  for(let i = 0; i \u003c 90; i++){\n    const c = document.createElement('i');\n    c.className = 'confetti';\n    c.style.left = Math.random() * 100 + 'vw';\n    c.style.background = cols[i % cols.length];\n    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';\n    c.style.animationDelay = Math.random() * .8 + 's';\n    document.body.appendChild(c);\n    setTimeout(() => c.remove(), 6000);\n  }\n}\n\n/* ---------- Archive ---------- */\nfunction openArchive(){\n  clearInterval(countdownId); cancelAnimationFrame(timerRaf); locked = true;\n  const cards = [];\n  for(let n = todayDay; n >= 1; n--){\n    const iso = isoForDay(n), done = store.results[iso], part = store.progress[iso], isT = n === todayDay;\n    let cls = '', label = 'プレイする';\n    if(done){ cls = 'done'; label = '○ ' + done.correct + '／' + done.total + '問・' + fmtNum(done.points) + 'pt'; }\n    else if(part){ cls = 'part'; label = 'プレイ中'; }\n    else if(isT){ cls = 'today'; label = '今日のクイズ'; }\n    cards.push('\u003cbutton class=\"rcard' + (isT ? ' is-today' : '') + '\" type=\"button\" data-day=\"' + n + '\">' +\n      '\u003cspan class=\"no\">第' + n + '回・' +\n        esc(JA_SHORT.format(dateForDay(n))) + '\u003c/span>' +\n      '\u003cspan class=\"tt\">' + esc(roundForDay(n).theme) + '\u003c/span>' +\n      '\u003cspan class=\"st ' + cls + '\">' + label + '\u003c/span>\u003c/button>');\n  }\n  $('#archiveGrid').innerHTML = cards.join('');\n  document.querySelectorAll('.rcard').forEach(b => b.addEventListener('click', () => openDay(Number(b.dataset.day))));\n  show('archive');\n  setTimeout(() => softFocus(document.querySelector('.rcard')), 450);\n}\nfunction goHome(){\n  clearInterval(countdownId); cancelAnimationFrame(timerRaf); locked = true;\n  paintLanding(); show('landing');\n  setTimeout(() => softFocus($('#startBtn')), 450);\n}\nfunction toHub(){ try{ parent.postMessage({ umg:'home' }, '*'); }catch(e){} }\n\n/* ---------- Keyboard / TV remote ---------- */\ndocument.addEventListener('keydown', e => {\n  const visible = id => !$('#' + id).classList.contains('hidden-right') && !$('#' + id).classList.contains('hidden-left');\n  if(visible('game') && !locked && document.querySelector('.opt')){\n    const map = { a:1, b:2, c:3, d:4, '1':1, '2':2, '3':3, '4':4 };\n    const k = map[String(e.key).toLowerCase()];\n    if(k){ e.preventDefault(); answer(k); return; }\n  }\n  if(isBackKey(e)){\n    e.preventDefault();\n    if(visible('landing')) toHub(); else goHome();\n    return;\n  }\n  const dirs = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };\n  const d = dirs[e.key]; if(!d) return;\n  const items = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'))\n    .filter(el => el.offsetParent !== null);\n  if(!items.length) return;\n  e.preventDefault();\n  const cur = document.activeElement;\n  if(items.indexOf(cur) === -1){ focusItem(items[0]); return; }\n  const c = cur.getBoundingClientRect(), cx = c.left + c.width/2, cy = c.top + c.height/2;\n  let best = null, bestScore = Infinity;\n  items.forEach(el => {\n    if(el === cur) return;\n    const r = el.getBoundingClientRect(), dx = (r.left + r.width/2) - cx, dy = (r.top + r.height/2) - cy;\n    const along = dx * d[0] + dy * d[1];\n    if(along \u003c= 1) return;\n    const score = along + (Math.abs(dx * d[1]) + Math.abs(dy * d[0])) * 2.5;\n    if(score \u003c bestScore){ bestScore = score; best = el; }\n  });\n  if(best) focusItem(best);\n});\nfunction focusItem(el){ try{ el.focus({ preventScroll:true }); }catch(e){ el.focus(); }\n  if(el.scrollIntoView) el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }\n\n/* ---------- Boot ---------- */\n$('#year').textContent = today.getFullYear();\npaintLanding();\n$('#startBtn').addEventListener('click', () => openDay(todayDay));\n$('#landingArchiveBtn').addEventListener('click', openArchive);\n$('#landingShareBtn').addEventListener('click', shareLanding);\nbindSocial('landingLineBtn', 'landingXBtn', landingText);\n$('#hubBtn').addEventListener('click', toHub);\n$('#arcHomeBtn').addEventListener('click', goHome);\nsetTimeout(() => softFocus($('#startBtn')), 300);\n\n/* ===== LINE / X シェア ===== */\nfunction socialShare(kind, text){\n  if(!text) return;\n  var web = /^https?:$/.test(UMG_HOST.protocol);\n  var url = web ? UMG_HOST.url : '';\n  var href = kind === 'line'\n    ? 'https://line.me/R/share?text=' + encodeURIComponent(text + (url ? '\\n' + url : ''))\n    : 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : '');\n  /* 新しいタブで開く（ゲーム画面はそのまま残す） */\n  var a = document.createElement('a');\n  a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';\n  a.style.display = 'none'; document.body.appendChild(a); a.click();\n  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 0);\n}\nfunction bindSocial(lineId, xId, getText){\n  var l = document.getElementById(lineId), x = document.getElementById(xId);\n  if(l) l.addEventListener('click', function(){ socialShare('line', getText()); });\n  if(x) x.addEventListener('click', function(){ socialShare('x', getText()); });\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="src-blockbuster">"\u003c!DOCTYPE html>\n\u003chtml lang=\"ja\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>ブロックバスター 毎日の映画キャスト・パズル | Universal+\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"16x16\" href=\"favicon-16x16.png\">\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"32x32\" href=\"favicon-32x32.png\">\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"48x48\" href=\"favicon-48x48.png\">\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"64x64\" href=\"favicon-64x64.png\">\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"favicon-192x192.png\">\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"512x512\" href=\"favicon-512x512.png\">\n\u003clink rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"apple-touch-icon.png\">\n\u003cmeta name=\"theme-color\" content=\"#1b0f3b\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{\n    --gold:#ffc83d;--pink:#ff4f9a;--cyan:#33d6ff;--blood:#8e1c24;--navy:#1b0f3b;--bg2:#2b1166;--bg3:#0d3b7a;--panel:rgba(20,10,48,.72);\n    --white:#fff;--green:#22c97a;--red:#ff5a5a;--muted:#c9c3e6;--line:rgba(255,255,255,.2);\n    --bs:min(92vw,540px);           /* board size */\n  }\n  *{box-sizing:border-box}\n  html{background:var(--navy)}\n  html,body{width:100%;height:100%;margin:0;position:relative;overflow:hidden;color:var(--white);\n    font-family:\"Noto Sans JP\",\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"BIZ UDPGothic\",\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}\n  button,a{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}\n  button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:4px}\n  .kbd button:focus,.kbd a:focus{outline:4px solid var(--gold);outline-offset:4px}\n\n  /* ---------- Background video (anti-flicker: own layer, no filters) ---------- */\n  #bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-4;pointer-events:none;\n    background:radial-gradient(circle at 15% 20%,rgba(255,79,154,.35),transparent 45%),\n               radial-gradient(circle at 85% 75%,rgba(51,214,255,.30),transparent 50%),\n               linear-gradient(135deg,var(--navy),var(--bg2) 55%,var(--bg3))}\n  /* Soft colour spots: radial gradients (no blur filter) so they never flicker */\n  .spot{position:fixed;width:80vmax;height:80vmax;border-radius:50%;z-index:-3;opacity:.4;pointer-events:none;\n    will-change:transform;transform:translateZ(0);animation:drift 18s ease-in-out infinite alternate}\n  .spot.a{background:radial-gradient(circle,rgba(255,79,154,.55),transparent 65%);top:-40vmax;left:-30vmax}\n  .spot.b{background:radial-gradient(circle,rgba(51,214,255,.5),transparent 65%);bottom:-40vmax;right:-30vmax;animation-delay:-9s}\n  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(10vmax,8vmax,0)}}\n  #bgVideo{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.22;z-index:-2;\n    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;pointer-events:none}\n  #bgVideo.failed{display:none}\n  #bgOverlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;\n    background:linear-gradient(180deg,rgba(27,15,59,0),rgba(27,15,59,.35))}\n\n  /* ---------- Screens ---------- */\n  .screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;\n    padding:24px 24px\n            56px 24px;\n    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))\n            max(56px,calc(env(safe-area-inset-bottom) + 38px)) max(24px,env(safe-area-inset-left));\n    transition:transform .65s cubic-bezier(.22,.8,.25,1),opacity .45s,visibility 0s;\n    overflow:auto;-webkit-overflow-scrolling:touch;overflow-anchor:none;scroll-behavior:auto}\n  .hidden-left,.hidden-right{opacity:0;pointer-events:none;visibility:hidden;\n    transition:transform .65s cubic-bezier(.22,.8,.25,1),opacity .45s,visibility 0s linear .65s}\n  .hidden-left{transform:translateX(-105%)}\n  .hidden-right{transform:translateX(105%)}\n\n  /* ---------- Landing ---------- */\n  .landing-content{width:100%;max-width:940px;width:min(940px,100%);text-align:center;margin:auto}\n  .logo{display:block;max-width:520px;max-width:min(520px,75vw);max-height:10vh;margin:0 auto 12px;margin:0 auto clamp(4px,1vh,12px);object-fit:contain}\n  .small-logo{display:block;max-width:200px;max-width:min(200px,42vw);max-height:10vh;margin:0 auto;object-fit:contain}\n  .brand{font-size:82px;font-size:clamp(34px,6.4vw,82px);line-height:1;margin:0 0 10px;font-weight:800;\n    letter-spacing:.02em;text-transform:uppercase;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .brand .of{display:block;font-size:.3em;letter-spacing:.36em;color:var(--cyan);-webkit-text-fill-color:var(--cyan);margin:14px 0 0;font-weight:700}\n  .datestamp{color:var(--muted);letter-spacing:.24em;text-transform:uppercase;font-size:15px;font-size:clamp(11px,1.6vw,15px);margin:22px 0 0}\n  .rule{width:70%;max-width:420px;width:min(420px,70%);height:2px;background:linear-gradient(90deg,transparent,var(--pink),var(--gold),var(--cyan),transparent);margin:20px auto}\n  .tagline{color:#e9e4ff;font-size:20px;font-size:clamp(15px,2vw,20px);max-width:660px;margin:0 auto 26px;line-height:1.5}\n  .how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:820px;width:min(820px,100%);margin:0 auto 26px}\n  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:560px;width:min(560px,100%);margin:0 auto 30px}\n  .stat{padding:14px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}\n  .stat b{display:block;font-size:40px;font-size:clamp(26px,4.6vw,40px);color:var(--gold);line-height:1.1}\n  .stat span{display:block;font-size:12px;font-size:clamp(10px,1.4vw,12px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}\n  .landing-actions{display:flex;flex-direction:column;align-items:center;gap:14px}\n  .landing-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}\n  .landing-row .btn{min-width:170px;min-width:min(170px,40vw)}\n\n  /* ---------- Buttons ---------- */\n  .btn{min-height:56px;padding:14px 26px;border:2px solid var(--line);border-radius:14px;color:#fff;\n    background:rgba(30,16,70,.8);font-weight:800;cursor:pointer;letter-spacing:.04em;\n    transition:transform .18s,background .18s,border-color .18s}\n  .btn:hover:not(:disabled){transform:scale(1.04);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .btn:focus-visible{transform:scale(1.04);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .btn:focus{transform:scale(1.04);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .btn.primary{background:linear-gradient(90deg,var(--gold),#ff9f3d);color:#2a1300;border-color:#ffe39a}\n  .btn.primary:hover:not(:disabled){background:linear-gradient(90deg,#ffd76a,#ffb15e)}\n  .btn.primary:focus-visible{background:linear-gradient(90deg,#ffd76a,#ffb15e)}\n  .kbd .btn.primary:focus{background:linear-gradient(90deg,#ffd76a,#ffb15e)}\n  .btn.ghost{min-height:48px;padding:10px 22px;font-size:15px;font-size:clamp(13px,1.6vw,15px);background:rgba(255,79,154,.18);border-color:rgba(255,79,154,.6)}\n  .btn.sm{min-height:46px;padding:8px 14px;font-size:14px;font-size:clamp(12.5px,1.5vw,14px)}\n  .btn:disabled{opacity:.45;cursor:default;transform:none}\n  .btn-lg{font-size:22px;font-size:clamp(17px,2.2vw,22px);min-width:300px;min-width:min(300px,80vw);text-transform:uppercase}\n\n  /* ---------- Rule chips (Meowdoku-style) ---------- */\n  .chiprule{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 10px;\n    border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,200,61,.3);\n    color:#ffe7a8;font-size:14px;font-size:clamp(11.5px,1.45vw,14px);line-height:1.35;font-weight:600}\n\n  /* ---------- Game ---------- */\n  #game{align-items:flex-start}\n  .wrap{width:100%;max-width:1080px;width:min(1080px,100%);margin:auto;display:flex;flex-direction:column;gap:20px;gap:clamp(12px,2vh,20px)}\n  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}\n  .day-no{letter-spacing:.24em;text-transform:uppercase;font-size:13px;font-size:clamp(10px,1.4vw,13px);color:var(--cyan);font-weight:800}\n  .title{font-size:40px;font-size:clamp(24px,3.4vw,40px);margin:4px 0 0;line-height:1.05;font-weight:800;text-transform:uppercase;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .timer{font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.14em;font-size:16px;font-size:clamp(13px,1.7vw,16px);font-weight:700}\n  .archive-flag{display:none;padding:10px 16px;border-radius:12px;background:rgba(255,200,61,.12);\n    border:1px solid rgba(255,200,61,.35);font-size:15px;font-size:clamp(12px,1.6vw,15px);font-weight:700;color:#ffe7a8}\n  .archive-flag.on{display:block}\n  .rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n  .play{display:flex;flex-direction:column;align-items:center;gap:18px}\n  .side{width:var(--bs);display:flex;flex-direction:column;gap:14px}\n\n  /* Board */\n  .board{width:var(--bs);height:var(--bs);background:#fbf8f3;border-radius:18px;padding:calc(var(--bs)*.03);\n    display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:calc(var(--bs)*.016);\n    box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 4px rgba(255,200,61,.35)}\n  .cell{position:relative;border:0;padding:0;margin:0;border-radius:calc(var(--bs)*.022);cursor:pointer;\n    display:grid;place-items:center;min-width:0;min-height:0;transition:filter .15s,transform .15s}\n  .board.placing .cell:hover:not(:disabled){filter:brightness(1.08)}\n  .cell:focus-visible{outline:4px solid var(--bg2);outline-offset:-4px}\n  .kbd .cell:focus{outline:4px solid var(--bg2);outline-offset:-4px}\n  .cell:disabled{cursor:default}\n  .tok{width:74%;height:74%;border-radius:50%;background:var(--bg2);color:#fff;border:3px solid var(--gold);\n    display:grid;place-items:center;font-weight:800;font-size:calc(var(--bs)*.05);letter-spacing:.02em;\n    box-shadow:0 4px 10px rgba(0,0,0,.35);animation:pop .22s ease-out}\n  .tok.hint{background:var(--gold);color:#2a1300;border-color:#fff}\n  .cell.bad .tok{background:var(--red);border-color:#ffc2bd;color:#fff}\n  .cell.win .tok{border-color:#9ff5cb}\n  .xm{font-size:calc(var(--bs)*.06);color:rgba(42,19,0,.5);font-weight:800;line-height:1}\n  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}\n\n  /* Region colours + patterns (patterns help colour-blind players) */\n  .c0{background-color:#E3B941}\n  .c1{background-color:#E5A7C1}\n  .c2{background-color:#9079D4}\n  .c3{background-color:#4FB7A6}\n  .c4{background-color:#EE8B5B}\n  .c1{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 4px,transparent 4px 12px)}\n  .c2{background-image:radial-gradient(rgba(255,255,255,.28) 18%,transparent 20%);background-size:12px 12px}\n  .c3{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 3px,transparent 3px 11px)}\n  .c4{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 3px,transparent 3px 12px),\n                       repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 3px,transparent 3px 12px)}\n\n  /* Legend */\n  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px;padding:clamp(14px,2vw,20px)}\n  .panel h3{margin:0 0 12px;font-size:13px;font-size:clamp(11px,1.4vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:800}\n  .legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}\n  .legend li{display:flex;align-items:center;gap:12px;font-size:17px;font-size:clamp(14px,1.75vw,17px);line-height:1.3}\n  .sw{flex:0 0 auto;width:26px;height:26px;border-radius:7px}\n  .legend small{color:var(--muted);font-size:.82em}\n\n  /* Actor tray */\n  .tray{display:grid;grid-template-columns:1fr;gap:9px}\n  .actor{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;min-height:54px;\n    border:2px solid var(--line);border-radius:14px;background:rgba(30,16,70,.85);color:#fff;cursor:pointer;\n    transition:transform .15s,border-color .15s,background .15s}\n  .actor:hover:not(:disabled){border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .actor:focus-visible{border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .actor:focus{border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .actor.sel{border-color:var(--gold);background:rgba(255,200,61,.22);box-shadow:0 0 0 2px var(--gold) inset}\n  .actor.placed{opacity:.6}\n  .actor.bad{border-color:#e0616a}\n  .actor:disabled{cursor:default}\n  .av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--bg2);border:2px solid var(--gold);\n    display:grid;place-items:center;font-weight:800;font-size:14px}\n  .actor.sel .av{background:var(--gold);color:#2a1300}\n  .nm{flex:1 1 auto;font-weight:700;font-size:17px;font-size:clamp(14px,1.75vw,17px);min-width:0}\n  .where{flex:0 0 auto;width:20px;height:20px;border-radius:6px;display:none}\n  .actor.placed .where{display:block}\n  .key{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:700}\n  .tip{color:var(--muted);font-size:14.5px;font-size:clamp(12.5px,1.55vw,14.5px);line-height:1.45;margin:0;text-align:center}\n  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n  .msg{min-height:1.4em;text-align:center;font-weight:700;font-size:16px;font-size:clamp(13.5px,1.7vw,16px);color:#ffb3ad;margin:0}\n  .msg.good{color:#9ff5cb}\n\n  /* ---------- Solution ---------- */\n  .solution{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;padding:clamp(20px,3vw,32px);animation:cardIn .5s forwards}\n  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}\n  .verdict-line{font-size:56px;font-size:clamp(28px,4.6vw,56px);font-weight:900;margin:0 0 6px;line-height:1.1;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .sub{font-size:22px;font-size:clamp(16px,2.1vw,22px);margin:0 0 18px;color:var(--gold);font-weight:800}\n  .solution h4{margin:18px 0 10px;font-size:13px;font-size:clamp(11px,1.5vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}\n  .cast{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}\n  .cast li{display:flex;gap:12px;align-items:flex-start;font-size:17px;font-size:clamp(14px,1.8vw,17px);line-height:1.45;color:#f1edff}\n  .cast .sw{width:20px;height:20px;margin-top:3px}\n  .cast em{color:var(--muted);display:block;font-size:.9em}\n  .streak-banner{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 0;padding:16px;border-radius:14px;\n    background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);font-weight:800;font-size:20px;font-size:clamp(15px,2vw,20px);flex-wrap:wrap;text-align:center}\n  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;gap:clamp(14px,2.4vw,24px);margin-top:24px}\n  .next-in{text-align:center;color:var(--muted);margin-top:22px;letter-spacing:.16em;text-transform:uppercase;\n    font-size:13px;\n    font-size:clamp(10.5px,1.4vw,13px);font-variant-numeric:tabular-nums}\n\n  /* ---------- Archive ---------- */\n  #archive{align-items:flex-start}\n  .archive-wrap{width:100%;max-width:1180px;width:min(1180px,100%);margin:auto;display:flex;flex-direction:column;gap:22px;gap:clamp(14px,2.2vh,22px)}\n  .archive-head{text-align:center}\n  .archive-head h2{font-size:46px;font-size:clamp(26px,4vw,46px);margin:0 0 8px;font-weight:800;text-transform:uppercase}\n  .archive-head p{color:var(--muted);margin:0;font-size:16px;font-size:clamp(13px,1.7vw,16px)}\n  .archive-stats{display:flex;justify-content:center;gap:34px;gap:clamp(14px,3vw,34px);flex-wrap:wrap;padding:14px 0;\n    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n  .archive-stats div{text-align:center}\n  .archive-stats b{display:block;color:var(--gold);font-size:30px;font-size:clamp(20px,3vw,30px);line-height:1.2}\n  .archive-stats span{font-size:11.5px;font-size:clamp(9.5px,1.3vw,11.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n  .archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}\n  .day-card{position:relative;text-align:left;padding:16px 16px 50px;border:2px solid var(--line);border-radius:16px;\n    background:rgba(30,16,70,.85);color:#fff;cursor:pointer;min-height:130px;transition:transform .18s,background .18s,border-color .18s}\n  .day-card:hover{transform:scale(1.02);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .day-card:focus-visible{transform:scale(1.02);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .day-card:focus{transform:scale(1.02);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .day-card.is-today{border-color:rgba(255,200,61,.7)}\n  .dc-no{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:800}\n  .dc-sw{display:flex;gap:6px;margin:10px 0 8px}\n  .dc-sw span{width:20px;height:20px;border-radius:5px}\n  .dc-films{display:block;color:var(--muted);font-size:13.5px;font-size:clamp(12px,1.45vw,13.5px);line-height:1.4}\n  .dc-status{position:absolute;left:16px;bottom:14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding:5px 11px;border-radius:999px}\n  .dc-status.solved{background:rgba(31,157,94,.25);color:#9ff5cb;border:1px solid rgba(31,157,94,.6)}\n  .dc-status.progress{background:rgba(255,200,61,.18);color:#ffe7a8;border:1px solid rgba(255,200,61,.5)}\n  .dc-status.unplayed{background:rgba(255,255,255,.1);color:#e9e4ff;border:1px solid var(--line)}\n  .dc-status.today{background:var(--gold);color:#2a1300;border:1px solid #ffe39a}\n  .archive-foot{display:flex;justify-content:center;padding-bottom:26px;padding-bottom:clamp(14px,2.5vh,26px)}\n\n  /* ---------- Footer / loader ---------- */\n  #copyright{position:fixed;left:0;right:0;bottom:0;z-index:6;text-align:center;font-size:13px;font-size:clamp(10px,1.3vw,13px);\n    color:rgba(255,255,255,.7);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none;text-shadow:0 1px 4px #000}\n  #loader{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;align-content:center;gap:26px;background:var(--navy);z-index:9999;\n    transition:opacity .5s ease;padding:24px;text-align:center}\n  #loader.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}\n  .spinner{position:relative;width:160px;width:clamp(110px,18vw,160px);height:160px;height:clamp(110px,18vw,160px);display:grid;place-items:center}\n  .spinner .ring{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:5px solid rgba(255,200,61,.18);border-top-color:var(--gold);border-right-color:var(--pink);animation:spin 1s linear infinite}\n  .spinner img{width:62%;height:62%;object-fit:contain;animation:pulse 1.6s ease-in-out infinite}\n  .loading-text{font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-size:14px;font-size:clamp(11px,1.5vw,14px)}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1);opacity:1}}\n\n  /* ---------- Responsive ---------- */\n  @media(min-width:960px){\n    :root{--bs:min(540px,64vh,52vw)}\n    .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px}\n    .side{width:380px;width:min(380px,34vw)}\n  }\n  /* ---------- Drag & drop / swipe-to-mark ---------- */\n  .board,.tray{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  .cell,.actor{touch-action:none}\n  .actor:not(:disabled){cursor:grab}\n  .actor.dragging{opacity:.35}\n  .cell.drop-target{filter:brightness(1.12);box-shadow:inset 0 0 0 4px #fff}\n  .cell.drop-target.drop-bad{box-shadow:inset 0 0 0 4px var(--red)}\n  .tok.lifted{opacity:.3}\n  .drag-ghost{position:fixed;left:0;top:0;z-index:10000;pointer-events:none;width:76px;width:clamp(52px,12vw,76px);height:76px;height:clamp(52px,12vw,76px);\n    border-radius:50%;background:var(--bg2);color:#fff;border:3px solid var(--gold);display:grid;place-items:center;\n    font-weight:800;font-size:24px;font-size:clamp(16px,3.6vw,24px);box-shadow:0 12px 30px rgba(0,0,0,.5);will-change:transform}\n  body.is-dragging,body.is-dragging *{cursor:grabbing!important}\n\n  /* Mobile / tablet portrait: movie key above the grid, cast straight below it */\n  @media(max-width:959px){\n    .play{gap:12px}\n    .side{display:contents}\n    .play > .board{order:2}\n    .legend-panel{order:1;width:var(--bs);padding:10px 12px}\n    .legend-panel h3{margin:0 0 8px}\n    .legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}\n    .legend li{font-size:13px;gap:8px;min-width:0}\n    .legend li span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n    .legend .sw{width:18px;height:18px;border-radius:5px}\n    .cast-panel{order:3;width:var(--bs);padding:10px 12px}\n    .cast-panel h3{margin:0 0 8px}\n    .tray{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}\n    .actor{min-height:46px;padding:6px 8px;gap:8px}\n    .av{width:32px;height:32px;font-size:12px}\n    .nm{font-size:13.5px;line-height:1.2}\n    .side > .tip,.side > .msg,.side > .controls{order:4;width:var(--bs)}\n    .side > .msg{order:4}\n    .side > .controls{order:5}\n    .side > .tip{order:6}\n  }\n  @media(max-width:760px){\n    .rules,.how{grid-template-columns:repeat(2,minmax(0,1fr))}\n    .actions{grid-template-columns:1fr}\n    .screen{padding:18px 14px 52px}\n    .archive-grid{grid-template-columns:1fr}\n    .tok{border-width:2px}\n    .key{display:none}\n  }\n  @media(max-width:380px){ .controls{grid-template-columns:1fr 1fr} .controls .btn:last-child{grid-column:span 2} }\n  @media(min-width:1600px){\n    :root{--bs:min(760px,64vh)}\n    .screen{padding:5vh 7vw 7vh}\n    .btn{min-height:68px}\n    .side{width:520px;width:min(520px,30vw)}\n    .actor{min-height:66px}\n    .av{width:46px;height:46px;font-size:17px}\n  }\n  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n\n  /* ---- embedded in the Daily Movie Games hub ---- */\n  html,body{background:transparent!important}\n  #bg,.spot,#bgOverlay,#bgVideo,#loader{display:none!important}\n\n  body:not(.on-landing) #copyright{display:none}\n  /* ---- Smart TVs: no share sheet / clipboard on TV browsers, lighter animation ---- */\n  .tv #landingShareBtn,.tv #shareBtn{display:none!important}\n  .tv .spot,.tv .confetti{animation:none!important}\n  .kbd button:focus{outline:4px solid var(--gold);outline-offset:4px}\n\n  /* ---- Phones on their side: grid and side panel next to each other ---- */\n  @media (orientation:landscape) and (max-height:600px) and (min-width:560px) and (max-width:959px){\n    :root{--bs:min(82vh,46vw)}\n    .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:18px}\n    .side{display:flex;flex-direction:column;gap:10px;width:min(380px,46vw);order:3}\n    #game .rules{display:none}\n    .screen{padding:12px 16px 40px}\n  }\n\n  /* ---- room for the hub's music button in the top-right corner ---- */\n  .topbar,.top{padding-right:56px}\n  @media(min-width:1600px){ .topbar,.top{padding-right:76px} }\n\n  /* ===== 日本語ローカライズ: タイポグラフィ ===== */\n  html,body,button,input{font-family:\"Noto Sans JP\",\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"BIZ UDPGothic\",\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif}\n  body{line-height:1.7;line-break:strict;overflow-wrap:anywhere;word-break:normal}\n  *,*::before,*::after{font-style:normal!important;text-transform:none!important}\n  p,li,.tagline,.tip,.msg,.chiprule,.gdesc,.qtext,.review div,.cast li,.chain li,.legend li,.sub,.banner,.streak-banner,\n  .archive-head p,.dc-films,.dc-meta,.movie-meta,.feedback,.points,.verdict,.archive-flag,.replay-flag,.theme-pill,.progress{line-height:1.7}\n  /* 欧文向けの広い字間は和文では読みにくいので詰める */\n  .datestamp,.day-no,.dc-no,.stat span,.archive-stats span,.loading-text,.next-in,.panel h3,.solution h4,.chip,.dc-status,\n  .brand .of,.brand .l1,.brand .l3,.qnum,.round-sub,.meter,.wd,.rcard .no,.rcard .st,.score small,.timer,.gbtn,.slot .gn{letter-spacing:.06em!important}\n  .brand,.brand .l2,.title,.gname,.btn,.actor,.verdict-line,.archive-head h2{letter-spacing:.02em!important}\n  .brand .of{font-size:.34em}\n  /* LINE / X シェア */\n  .social{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px}\n  .social .btn{min-width:150px}\n  .btn.line{background:#06C755;border-color:#06C755;color:#fff}\n  .btn.xpost{background:#111;border-color:#555;color:#fff}\n  .btn.line:hover:not(:disabled),.btn.line:focus-visible{background:#05b14c;border-color:#fff}\n  .btn.xpost:hover:not(:disabled),.btn.xpost:focus-visible{background:#333;border-color:#fff}\n  .tv .social,.tv .line,.tv .xpost{display:none!important}\n  /* U-NEXT で Universal+ を観る */\n  .unext{display:flex;align-items:center;gap:16px;margin:22px auto 0;max-width:560px;padding:14px 20px;border-radius:16px;\n    text-decoration:none;color:#fff;background:linear-gradient(90deg,#0b1a2e,#123a6b);border:2px solid #4aa3ff;\n    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,background .15s}\n  .unext:hover,.unext:focus-visible{transform:scale(1.03);border-color:var(--gold);background:linear-gradient(90deg,#10264a,#1a4f92)}\n  .kbd .unext:focus{transform:scale(1.03);border-color:var(--gold);outline:4px solid var(--gold);outline-offset:4px}\n  .unext img{flex:0 0 auto;height:44px;width:auto;max-width:120px;object-fit:contain}\n  .unext-txt{flex:1 1 auto;display:flex;flex-direction:column;text-align:left;line-height:1.5}\n  .unext-txt b{font-size:18px;font-size:clamp(15px,1.9vw,18px);font-weight:800}\n  .unext-txt small{font-size:13px;color:#cfe3ff}\n  .unext-arrow{flex:0 0 auto;font-size:22px;font-weight:800;color:var(--gold)}\n  @media(max-width:480px){ .unext{gap:10px;padding:12px 14px} .unext img{height:34px;max-width:90px} }\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"on-landing\">\n\u003cvideo id=\"bgVideo\" autoplay muted loop playsinline preload=\"auto\" disablepictureinpicture>\n\u003c/video>\n\u003cdiv id=\"bgOverlay\">\u003c/div>\n\u003cdiv id=\"bg\">\u003c/div>\n\u003cdiv class=\"spot a\">\u003c/div>\u003cdiv class=\"spot b\">\u003c/div>\n\n\u003cdiv id=\"loader\" role=\"status\" aria-live=\"polite\" aria-label=\"読み込み中\">\n  \u003cdiv class=\"spinner\">\u003cdiv class=\"ring\">\u003c/div>\u003cimg src=\"logo_white.png\" alt=\"\">\u003c/div>\n  \u003cdiv class=\"loading-text\">今日のキャストを準備中&hellip;\u003c/div>\n\u003c/div>\n\n\u003c!-- ============ LANDING ============ -->\n\u003csection id=\"landing\" class=\"screen\">\n  \u003cmain class=\"landing-content\">\n    \u003cimg class=\"logo\" src=\"logo_white.png\" alt=\"ロゴ\">\n    \u003ch1 class=\"brand\">ブロックバスター\u003cspan class=\"of\">毎日の映画キャスト・パズル\u003c/span>\u003c/h1>\n    \u003cdiv class=\"rule\">\u003c/div>\n    \u003cp class=\"datestamp\" id=\"landingDate\">\u003c/p>\n    \u003cp class=\"tagline\" id=\"landingTag\">5本の映画と5人のスター。全員を正しいマスに配置しましょう。\u003c/p>\n    \u003cdiv class=\"how\">\n      \u003cdiv class=\"chiprule\">映画の色ごとにスターは1人\u003c/div>\n      \u003cdiv class=\"chiprule\">どの行・列にもスターは1人\u003c/div>\n      \u003cdiv class=\"chiprule\">スター同士はななめも含めて隣り合わない\u003c/div>\n      \u003cdiv class=\"chiprule\">置いたマスの映画に出演していること\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stats\">\n      \u003cdiv class=\"stat\">\u003cb id=\"statStreak\">0\u003c/b>\u003cspan>連続日数\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statBest\">0\u003c/b>\u003cspan>最高記録\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statSolved\">0\u003c/b>\u003cspan>クリア\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"landing-actions\">\n      \u003cbutton id=\"startBtn\" class=\"btn primary btn-lg\" type=\"button\">今日のパズルに挑戦\u003c/button>\n      \u003cdiv class=\"landing-row\">\n        \u003cbutton id=\"landingArchiveBtn\" class=\"btn ghost\" type=\"button\">過去のパズル\u003c/button>\n        \u003cbutton id=\"landingShareBtn\" class=\"btn ghost\" type=\"button\">シェア\u003c/button>\n        \u003cbutton id=\"landingLineBtn\" class=\"btn ghost line\" type=\"button\">LINE\u003c/button>\n        \u003cbutton id=\"landingXBtn\" class=\"btn ghost xpost\" type=\"button\">X\u003c/button>\n        \u003cbutton id=\"hubBtn\" class=\"btn ghost\" type=\"button\">ゲーム一覧\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ GAME ============ -->\n\u003csection id=\"game\" class=\"screen hidden-right\">\n  \u003cmain class=\"wrap\">\n    \u003cimg class=\"small-logo\" src=\"logo_white.png\" alt=\"ロゴ\">\n    \u003cdiv class=\"archive-flag\" id=\"archiveFlag\">\u003c/div>\n    \u003cheader class=\"top\">\n      \u003cdiv>\n        \u003cdiv class=\"day-no\" id=\"dayNo\">\u003c/div>\n        \u003ch2 class=\"title\">ブロックバスター\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"timer\" id=\"timer\">0:00\u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"rules\">\n      \u003cdiv class=\"chiprule\">映画の色ごとにスターは1人\u003c/div>\n      \u003cdiv class=\"chiprule\">どの行・列にもスターは1人\u003c/div>\n      \u003cdiv class=\"chiprule\">スター同士はななめも含めて隣り合わない\u003c/div>\n      \u003cdiv class=\"chiprule\">置いたマスの映画に出演していること\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"play\">\n      \u003cdiv class=\"board\" id=\"board\" role=\"grid\" aria-label=\"パズルのマス目\">\u003c/div>\n      \u003cdiv class=\"side\">\n        \u003csection class=\"panel legend-panel\">\u003ch3>今日の映画\u003c/h3>\u003cul class=\"legend\" id=\"legend\">\u003c/ul>\u003c/section>\n        \u003csection class=\"panel cast-panel\">\u003ch3>キャスト\u003c/h3>\u003cdiv class=\"tray\" id=\"tray\">\u003c/div>\u003c/section>\n        \u003cp class=\"tip\">スターをマスにドラッグするか、スターをタップしてからマスをタップしてください。置いたスターはドラッグで移動、盤面の外へドラッグで取り消せます。スターを選んでいないときは、空きマスをタップまたはなぞると「×」の目印を付けられます。\u003c/p>\n        \u003cp class=\"msg\" id=\"msg\" aria-live=\"polite\">\u003c/p>\n        \u003cdiv class=\"controls\">\n          \u003cbutton id=\"hintBtn\" class=\"btn sm\" type=\"button\">ヒント\u003c/button>\n          \u003cbutton id=\"resetBtn\" class=\"btn sm\" type=\"button\">クリア\u003c/button>\n          \u003cbutton id=\"gameHomeBtn\" class=\"btn sm\" type=\"button\">ホーム\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"solutionSlot\">\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ ARCHIVE ============ -->\n\u003csection id=\"archive\" class=\"screen hidden-right\">\n  \u003cmain class=\"archive-wrap\">\n    \u003cimg class=\"small-logo\" src=\"logo_white.png\" alt=\"ロゴ\">\n    \u003cdiv class=\"archive-head\">\n      \u003ch2>過去のパズル\u003c/h2>\n      \u003cp>初日からのパズルがすべてそろっています。見逃した日もプレイできます。\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"archive-stats\">\n      \u003cdiv>\u003cb id=\"arcSolved\">0\u003c/b>\u003cspan>クリア\u003c/span>\u003c/div>\n      \u003cdiv>\u003cb id=\"arcProgress\">0\u003c/b>\u003cspan>プレイ中\u003c/span>\u003c/div>\n      \u003cdiv>\u003cb id=\"arcOpen\">0\u003c/b>\u003cspan>未プレイ\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"archive-grid\" id=\"archiveGrid\">\u003c/div>\n    \u003cdiv class=\"archive-foot\">\u003cbutton id=\"arcHomeBtn\" class=\"btn\" type=\"button\">ホームへ戻る\u003c/button>\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003cfooter id=\"copyright\">&copy; \u003cspan id=\"year\">\u003c/span> NBCUniversal・毎日新しいキャストをお届けします\u003c/footer>\n\n\u003cscript>\n/* ---------- Compatibility: older smart-TV browsers (Chrome 53+) ---------- */\nif(!String.prototype.padStart){\n  String.prototype.padStart = function(n, s){\n    var t = String(this); if(t.length >= n) return t;\n    s = s === undefined ? ' ' : String(s); if(!s) return t;\n    var p = ''; while(p.length \u003c n - t.length) p += s;\n    return p.slice(0, n - t.length) + t;\n  };\n}\nif(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;\n\n/* ===== 日本語ローカライズ: 日付・数値（Intl ja-JP） ===== */\nvar JA_LONG = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });\nvar JA_SHORT = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'numeric', day:'numeric' });\nvar JA_NUM = new Intl.NumberFormat('ja-JP');\nvar JA_COMPACT = (function(){ try{ return new Intl.NumberFormat('ja-JP', { notation:'compact', maximumFractionDigits:1 }); }catch(e){ return JA_NUM; } })();\nfunction fmtNum(n){ return Math.abs(n) >= 10000 ? JA_COMPACT.format(n) : JA_NUM.format(n); }   /* 1万以上は「1.2万」「3億」表記 */\nfunction dayLabel(n){ return n + '日目'; }\nfunction fmtTimeJa(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60), r = s % 60; return (m ? m + '分' : '') + r + '秒'; }\n/* ======================================================================\n   Blockbuster - fully self-contained. No external data file needed.\n   Each day's puzzle is generated from the date with a seeded random\n   generator, so every player gets the same grid on the same day.\n   NOTE: editing the MOVIES list changes the puzzles for every day,\n   including past days. Only append to the end if you want to minimise this.\n   ====================================================================== */\nconst START_DATE = '2026-10-01';      // day 1\nconst STORE_KEY  = 'umg.blockbuster.v1';\nconst UMG_HOST = /*UMG_HOST*/null || { protocol: location.protocol, url: location.href };\nconst IS_TV = !!UMG_HOST.tv || /SMART-TV|SmartTV|Tizen|Web0S|webOS|WebOS|NetCast|LG Browser|HbbTV|BRAVIA|Sony|CrKey|GoogleTV|Google TV|Android TV|AndroidTV|AFT[A-Z]|Roku|VIDAA|Viera|Panasonic|AQUOS|Sharp|PhilipsTV|Philips|TPV|Hisense|Vizio|Opera TV|OMI|Vewd|Titan|Freeview|\\bTV\\b/i.test(navigator.userAgent);\n/* ---------- Input mode: show focus rings for remotes/keyboards, hide them for touch/mouse ---------- */\n(function(){\n  var root = document.documentElement;\n  if(IS_TV) root.classList.add('tv', 'kbd');\n  document.addEventListener('keydown', function(e){\n    if(/^(Arrow|Enter|Tab|Up|Down|Left|Right)/.test(e.key || '') || (e.keyCode >= 37 && e.keyCode \u003c= 40) || e.keyCode === 13) root.classList.add('kbd');\n  }, true);\n  document.addEventListener('pointerdown', function(e){ if(!IS_TV && e.pointerType) root.classList.remove('kbd'); }, true);\n})();\n\n/* Back button on every remote: Samsung Tizen (10009), LG webOS (461), Android/Fire TV, keyboards */\nvar BACK_KEYS = ['Escape','BrowserBack','GoBack','Back','XF86Back','Backspace'];\nvar BACK_CODES = [10009, 461, 166, 27, 8];\nfunction isBackKey(e){ return BACK_KEYS.indexOf(e.key) !== -1 || BACK_CODES.indexOf(e.keyCode) !== -1; }\n/* ---------- TV remotes: some TV browsers send old key names / codes; normalise them ---------- */\nvar KEY_ALIAS = { Left:'ArrowLeft', Up:'ArrowUp', Right:'ArrowRight', Down:'ArrowDown' };\nvar KEY_CODES = { 37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 13:'Enter' };\nfunction normKey(e){\n  var k = e.key;\n  if(KEY_ALIAS[k]) return KEY_ALIAS[k];\n  if((!k || k === 'Unidentified') && KEY_CODES[e.keyCode]) return KEY_CODES[e.keyCode];\n  return null;\n}\nfunction synthKey(target, k, code){\n  var ev;\n  try{ ev = new KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true }); }\n  catch(x){ ev = document.createEvent('Event'); ev.initEvent('keydown', true, true); try{ Object.defineProperty(ev, 'key', { get:function(){ return k; } }); }catch(y){} }\n  try{ Object.defineProperty(ev, 'keyCode', { get:function(){ return code || 0; } }); }catch(x){}\n  ev.umgSynthetic = true;\n  (target || document.body).dispatchEvent(ev);\n}\n\nfunction firstButton(){\n  var l = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'))\n    .filter(function(b){ return b.offsetParent !== null; });\n  return l[0] || null;\n}\nfunction fireKey(k, code){\n  document.documentElement.classList.add('kbd');\n  var t = document.activeElement;\n  if(!t || t === document.body || t === document.documentElement){\n    var f = firstButton();\n    if(f){ try{ f.focus({ preventScroll:true }); }catch(x){ f.focus(); } if(/^Arrow/.test(k)) return; t = f; }\n  }\n  if(k === 'Enter'){ if(t && t.tagName === 'BUTTON' && !t.disabled) t.click(); return; }\n  synthKey(t, k, code);\n}\nwindow.addEventListener('keydown', function(e){\n  if(e.umgSynthetic) return;\n  if(e.key === 'm' || e.key === 'M'){ try{ parent.postMessage({ umg:'music' }, '*'); }catch(x){} return; }\n  var k = normKey(e); if(!k) return;\n  e.preventDefault(); e.stopImmediatePropagation();\n  fireKey(k, e.keyCode);\n}, true);\n/* Keys pressed while the TV gave focus to the hub page are forwarded here */\nwindow.addEventListener('message', function(e){\n  var d = e.data || {}; if(d.umg !== 'key') return;\n  var k = KEY_ALIAS[d.key] || d.key;\n  if((!k || k === 'Unidentified') && KEY_CODES[d.code]) k = KEY_CODES[d.code];\n  if(k) fireKey(k, d.code);\n});\n/* Let the hub know about taps/presses here so it can start the video and music (browsers need a gesture) */\n(function(){\n  var last = 0;\n  function g(){ var n = Date.now(); if(n - last \u003c 800) return; last = n; try{ parent.postMessage({ umg:'gesture' }, '*'); }catch(x){} }\n  ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, g, { capture:true, passive:true }); });\n})();\n\n\n\n/* ==PURE-START== */\n/* [title, year, studio, [lead cast]] - please verify before launch */\nconst MOVIES = (/*MOVIES_DATA*/null).map(m => [m[0], m[1], m[2], m[3].slice(0, 6).map(n => n.split('|')[0])]);\n\nconst N = 5;\n/* All 5x5 placements: one per row/column, no diagonal touching (14 total) */\nconst PERMS = (() => {\n  const out = [], p = [], used = [];\n  (function rec(){\n    if(p.length === N){ out.push(p.slice()); return; }\n    for(let c = 0; c \u003c N; c++){\n      if(used[c]) continue;\n      if(p.length && Math.abs(p[p.length-1] - c) \u003c 2) continue;\n      used[c] = 1; p.push(c); rec(); p.pop(); used[c] = 0;\n    }\n  })();\n  return out;\n})();\n\nfunction mulberry(a){\n  return function(){\n    a |= 0; a = a + 0x6D2B79F5 | 0;\n    let t = Math.imul(a ^ a >>> 15, 1 | a);\n    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n    return ((t ^ t >>> 14) >>> 0) / 4294967296;\n  };\n}\nfunction shuffle(arr, r){\n  for(let i = arr.length - 1; i > 0; i--){ const j = r() * (i + 1) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }\n  return arr;\n}\nconst CAST_INDEX = (() => {\n  const m = {};\n  MOVIES.forEach((mv, i) => mv[3].forEach(a => { (m[a] = m[a] || []).push(i); }));\n  return m;\n})();\n\n/* Pick 5 movies, favouring ones that share actors (adds the overlap twist) */\nfunction pickMovies(r){\n  const set = [r() * MOVIES.length | 0];\n  let guard = 0;\n  while(set.length \u003c N && guard++ \u003c 400){\n    let cand = -1;\n    if(r() \u003c 0.7){\n      const pool = [];\n      set.forEach(i => MOVIES[i][3].forEach(a => CAST_INDEX[a].forEach(j => {\n        if(set.indexOf(j) \u003c 0 && pool.indexOf(j) \u003c 0) pool.push(j);\n      })));\n      if(pool.length) cand = pool[r() * pool.length | 0];\n    }\n    if(cand \u003c 0) cand = r() * MOVIES.length | 0;\n    if(set.indexOf(cand) \u003c 0) set.push(cand);\n  }\n  return set;\n}\n/* One distinct actor per movie; prefers actors who appear in several of today's movies */\nfunction pickActors(r, set){\n  const inSet = a => set.filter(i => MOVIES[i][3].indexOf(a) >= 0).length;\n  const chosen = [], used = {};\n  const preferOverlap = r() \u003c 0.75;\n  function rec(k){\n    if(k === N) return true;\n    let c = shuffle(MOVIES[set[k]][3].filter(a => !used[a]), r);\n    if(preferOverlap) c.sort((a, b) => inSet(b) - inSet(a));\n    for(const a of c){ used[a] = 1; chosen[k] = a; if(rec(k + 1)) return true; used[a] = 0; }\n    return false;\n  }\n  return rec(0) ? chosen.slice() : null;\n}\n/* Grow 5 contiguous colour regions out from the seed cells, with uneven sizes */\nfunction growRegions(r, seeds){\n  const own = new Array(N * N).fill(-1);\n  seeds.forEach((c, k) => { own[c] = k; });\n  const w = seeds.map(() => 0.25 + r() * 2.2);\n  let left = N * N - N;\n  while(left > 0){\n    const fr = seeds.map((_, k) => {\n      const s = [];\n      for(let c = 0; c \u003c N * N; c++){\n        if(own[c] !== k) continue;\n        const R = c / N | 0, C = c % N;\n        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => {\n          const rr = R + d[0], cc = C + d[1];\n          if(rr >= 0 && rr \u003c N && cc >= 0 && cc \u003c N && own[rr * N + cc] \u003c 0 && s.indexOf(rr * N + cc) \u003c 0) s.push(rr * N + cc);\n        });\n      }\n      return s;\n    });\n    let tot = 0; fr.forEach((s, k) => { if(s.length) tot += w[k]; });\n    let x = r() * tot, k = -1;\n    for(let i = 0; i \u003c N; i++){ if(!fr[i].length) continue; k = i; x -= w[i]; if(x \u003c= 0) break; }\n    const cell = fr[k][r() * fr[k].length | 0];\n    own[cell] = k; left--;\n  }\n  return own;\n}\n/* Count full solutions: placement AND which actor goes where */\nfunction countSolutions(own, elig, limit){\n  let n = 0;\n  for(const p of PERMS){\n    const reg = p.map((c, row) => own[row * N + c]);\n    if(new Set(reg).size \u003c N) continue;\n    const usedRow = [];\n    (function rec(a){\n      if(n > limit) return;\n      if(a === N){ n++; return; }\n      for(let row = 0; row \u003c N; row++){\n        if(usedRow[row] || elig[a].indexOf(reg[row]) \u003c 0) continue;\n        usedRow[row] = 1; rec(a + 1); usedRow[row] = 0;\n      }\n    })(0);\n    if(n > limit) break;\n  }\n  return n;\n}\nfunction buildPuzzle(day){\n  const r = mulberry((day * 2654435761) ^ 0x5EED1234);\n  let best = null;\n  for(let outer = 0; outer \u003c 300; outer++){\n    const set = pickMovies(r);\n    if(set.length \u003c N) continue;\n    const actors = pickActors(r, set);\n    if(!actors) continue;\n    const elig = actors.map(a => set.map((m, i) => MOVIES[m][3].indexOf(a) >= 0 ? i : -1).filter(i => i >= 0));\n    for(let inner = 0; inner \u003c 30; inner++){\n      const perm = PERMS[r() * PERMS.length | 0];\n      const rows = shuffle([0,1,2,3,4], r);\n      const seeds = actors.map((_, k) => rows[k] * N + perm[rows[k]]);\n      const own = growRegions(r, seeds);\n      const n = countSolutions(own, elig, 3);\n      const cand = { n, set, actors, elig, seeds, own };\n      if(!best || n \u003c best.n) best = cand;\n      if(n === 1) return finish(best, r, day);\n    }\n  }\n  return finish(best, r, day);\n}\nfunction finish(b, r, day){\n  const order = shuffle([0,1,2,3,4], r);      // tray order must not mirror colour order\n  return {\n    day,\n    unique: b.n === 1,\n    own: b.own,\n    movies: b.set.map(i => ({ t: MOVIES[i][0], y: MOVIES[i][1], s: MOVIES[i][2] })),\n    actors: order.map(k => ({ name: b.actors[k], films: b.elig[k] })),\n    solution: order.map(k => b.seeds[k])\n  };\n}\n/* ==PURE-END== */\n\n\n/* Board size for browsers without CSS min() (older smart TVs) - mirrors the --bs media rules */\n(function(){\n  if(window.CSS && CSS.supports && CSS.supports('width', 'min(1px, 2px)')) return;\n  function fit(){\n    var w = window.innerWidth, h = window.innerHeight, v;\n    if(w >= 1600) v = Math.min(760, .64 * h);\n    else if(w >= 960) v = Math.min(540, .64 * h, .52 * w);\n    else if(h \u003c= 600 && w > h && w >= 560) v = Math.min(.82 * h, .46 * w);\n    else v = Math.min(.92 * w, 540);\n    document.documentElement.style.setProperty('--bs', Math.floor(v) + 'px');\n  }\n  fit(); window.addEventListener('resize', fit);\n})();\n\n/* ---------- Helpers ---------- */\nconst COLORS = ['#E3B941','#E5A7C1','#9079D4','#4FB7A6','#EE8B5B'];\nconst EMOJI  = ['\\u{1F7E8}','\\u{1F7E5}','\\u{1F7EA}','\\u{1F7E9}','\\u{1F7E7}'];\nconst MS_DAY = 86400000;\nconst $ = s => document.querySelector(s);\nconst esc = str => String(str).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst localMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();\nconst parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getTime(); };\nconst toISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\nconst dayNumberFor = d => Math.round((localMidnight(d) - parseISO(START_DATE)) / MS_DAY) + 1;\nconst dateForDay = n => { const b = new Date(parseISO(START_DATE)); return new Date(b.getFullYear(), b.getMonth(), b.getDate() + n - 1); };\nconst isoForDay = n => toISO(dateForDay(n));\nconst fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');\nconst longDate = d => JA_LONG.format(d);\n\nconst cache = {};\nconst puzzleForDay = n => cache[n] || (cache[n] = buildPuzzle(n));\n\nfunction initialsFor(names){\n  /* 日本語版: イニシャルの代わりに姓のカタカナ先頭2文字（重複時は3文字）を表示 */\n  const sur = names.map(n => {\n    const p = n.split(/[・＝\\s]+/).filter(x => x && !/^(Jr\\.?|Sr\\.?|[A-Z]{1,2})$/.test(x));\n    return p.length ? p[p.length - 1] : n;\n  });\n  let ini = sur.map(x => x.slice(0, 2));\n  ini = ini.map((v, i) => ini.indexOf(v) !== ini.lastIndexOf(v) ? sur[i].slice(0, 3) : v);\n  return ini;\n}\n\n/* ---------- Storage ---------- */\nconst blankStore = () => ({ results:{}, progress:{}, streak:0, best:0, solved:0, lastPlayedISO:null });\nfunction loadStore(){\n  try{ const raw = localStorage.getItem(STORE_KEY); return raw ? Object.assign(blankStore(), JSON.parse(raw)) : blankStore(); }\n  catch(e){ return blankStore(); }\n}\nfunction saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }\nfunction displayStreak(){\n  if(!store.lastPlayedISO) return 0;\n  const y = toISO(new Date(parseISO(todayISO) - MS_DAY));\n  return (store.lastPlayedISO === todayISO || store.lastPlayedISO === y) ? store.streak : 0;\n}\n\n/* ---------- State ---------- */\nconst today = new Date();\nconst todayISO = toISO(today);\nconst todayDay = Math.max(1, dayNumberFor(today));\nlet store = loadStore();\nlet P = null, iso = '', dayN = 0, isToday = true, ini = [];\nlet st = null;            // { placed:[cell|-1], marks:[cells], hints, locked:[actor idx], elapsed }\nlet sel = -1, done = false, replay = false;\nlet timerId = null, countdownId = null;\n\nconst isTouch = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;\nfunction softFocus(el){ if(!el || (isTouch && !IS_TV)) return; try{ el.focus({ preventScroll:true }); }catch(e){} }\nfunction pinToTop(el){\n  if(!el) return; let f = 0;\n  const hold = () => { el.scrollTop = 0; if(++f \u003c 8) requestAnimationFrame(hold); };\n  hold(); setTimeout(() => { el.scrollTop = 0; }, 120); setTimeout(() => { el.scrollTop = 0; }, 420);\n}\nfunction scrollToEl(screen, el){\n  if(!screen || !el) return;\n  requestAnimationFrame(() => requestAnimationFrame(() => {\n    const top = Math.max(0, el.offsetTop - 12);\n    try{ screen.scrollTo({ top, behavior:'smooth' }); }catch(e){ screen.scrollTop = top; }\n  }));\n}\n\n/* ---------- Landing ---------- */\nfunction paintLanding(){\n  $('#landingDate').textContent = longDate(today);\n  $('#statStreak').textContent = displayStreak();\n  $('#statBest').textContent = store.best;\n  $('#statSolved').textContent = store.solved;\n  const r = store.results[todayISO];\n  if(r){\n    $('#startBtn').textContent = '今日の答えを見る';\n    $('#landingTag').textContent = fmtTimeJa(r.t) + 'でクリアしました。また明日、新しいキャストでお会いしましょう。';\n  }else{\n    $('#startBtn').textContent = store.progress[todayISO] ? '続きからプレイ' : '今日のパズルに挑戦';\n    $('#landingTag').textContent = '5本の映画と5人のスター。全員を正しいマスに配置しましょう。';\n  }\n}\n\n/* ---------- Game rendering ---------- */\nfunction buildBoard(){\n  const b = $('#board'); b.innerHTML = '';\n  for(let c = 0; c \u003c N * N; c++){\n    const k = P.own[c];\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    btn.className = 'cell c' + k;\n    btn.dataset.cell = c;\n    btn.addEventListener('click', () => { if(clickSuppressed()) return; tapCell(c); });\n    btn.addEventListener('pointerdown', e => cellPointerDown(e, c));\n    b.appendChild(btn);\n  }\n  $('#legend').innerHTML = P.movies.map((m, k) =>\n    '\u003cli>\u003cspan class=\"sw c' + k + '\">\u003c/span>\u003cspan>' + esc(m.t) + ' \u003csmall>(' + m.y + ')\u003c/small>\u003c/span>\u003c/li>').join('');\n  $('#tray').innerHTML = P.actors.map((a, i) =>\n    '\u003cbutton class=\"actor\" type=\"button\" data-a=\"' + i + '\">' +\n      '\u003cspan class=\"av\">' + esc(ini[i]) + '\u003c/span>\u003cspan class=\"nm\">' + esc(a.name) + '\u003c/span>' +\n      '\u003cspan class=\"where\">\u003c/span>\u003cspan class=\"key\">' + (i + 1) + '\u003c/span>\u003c/button>').join('');\n  document.querySelectorAll('.actor').forEach(btn =>\n    btn.addEventListener('click', () => { if(clickSuppressed()) return; selectActor(Number(btn.dataset.a)); }));\n  document.querySelectorAll('.actor').forEach(btn =>\n    btn.addEventListener('pointerdown', e => actorPointerDown(e, Number(btn.dataset.a))));\n}\n\nfunction conflicts(){\n  const bad = new Set(), pl = st.placed;\n  for(let a = 0; a \u003c N; a++) for(let b = a + 1; b \u003c N; b++){\n    if(pl[a] \u003c 0 || pl[b] \u003c 0) continue;\n    const ra = pl[a] / N | 0, ca = pl[a] % N, rb = pl[b] / N | 0, cb = pl[b] % N;\n    if(ra === rb || ca === cb || (Math.abs(ra - rb) \u003c= 1 && Math.abs(ca - cb) \u003c= 1) || P.own[pl[a]] === P.own[pl[b]]){\n      bad.add(a); bad.add(b);\n    }\n  }\n  return bad;\n}\n\nfunction paint(){\n  const bad = conflicts();\n  const who = new Array(N * N).fill(-1);\n  st.placed.forEach((c, a) => { if(c >= 0) who[c] = a; });\n  document.querySelectorAll('.cell').forEach(btn => {\n    const c = Number(btn.dataset.cell), a = who[c];\n    const m = P.movies[P.own[c]];\n    btn.classList.toggle('bad', a >= 0 && bad.has(a));\n    btn.classList.toggle('win', done);\n    btn.disabled = done;\n    let html = '', label = (Math.floor(c / N) + 1) + '行目、' + (c % N + 1) + '列目、' + m.t;\n    if(a >= 0){\n      html = '\u003cspan class=\"tok' + (st.locked.indexOf(a) >= 0 ? ' hint' : '') + '\">' + esc(ini[a]) + '\u003c/span>';\n      label += '、' + P.actors[a].name;\n    }else if(st.marks.indexOf(c) >= 0){\n      html = '\u003cspan class=\"xm\">×\u003c/span>'; label += '、目印あり';\n    }else label += '、空き';\n    if(btn.dataset.html !== html){ btn.innerHTML = html; btn.dataset.html = html; }\n    btn.setAttribute('aria-label', label);\n    btn.title = a >= 0 ? P.actors[a].name : '';\n  });\n  document.querySelectorAll('.actor').forEach(btn => {\n    const a = Number(btn.dataset.a), c = st.placed[a];\n    btn.classList.toggle('sel', a === sel);\n    btn.classList.toggle('placed', c >= 0);\n    btn.classList.
