<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universal+ デイリーゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64x64.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b0f3b">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffc83d;--pink:#ff4f9a;--cyan:#33d6ff;--navy:#1b0f3b;--bg2:#2b1166;--bg3:#0d3b7a;--panel:rgba(20,10,48,.72);
    --green:#22c97a;--muted:#c9c3e6;--line:rgba(255,255,255,.2);
  }
  *{box-sizing:border-box}
  html{background:var(--navy)}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;color:#fff;
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
  .kbd button:focus{outline:4px solid var(--gold);outline-offset:4px}

  /* ---------- Shared background (one video for every game; no blur filters, so no flicker) ---------- */
  #bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-4;pointer-events:none;
    background:radial-gradient(circle at 15% 20%,rgba(255,79,154,.35),transparent 45%),
               radial-gradient(circle at 85% 75%,rgba(51,214,255,.30),transparent 50%),
               linear-gradient(135deg,var(--navy),var(--bg2) 55%,var(--bg3))}
  .spot{position:fixed;width:80vmax;height:80vmax;border-radius:50%;z-index:-3;opacity:.4;pointer-events:none;
    will-change:transform;transform:translateZ(0);animation:drift 18s ease-in-out infinite alternate}
  .spot.a{background:radial-gradient(circle,rgba(255,79,154,.55),transparent 65%);top:-40vmax;left:-30vmax}
  .spot.b{background:radial-gradient(circle,rgba(51,214,255,.5),transparent 65%);bottom:-40vmax;right:-30vmax;animation-delay:-9s}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(10vmax,8vmax,0)}}
  #bgVideo{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.22;z-index:-2;
    transform:translateZ(0);backface-visibility:hidden;pointer-events:none}
  #bgVideo.failed{display:none}
  #bgOverlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(27,15,59,0),rgba(27,15,59,.35))}

  /* ---------- Hub ---------- */
  #hub{position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;
    padding:24px 20px
            56px 20px;
    padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right))
            max(56px,calc(env(safe-area-inset-bottom) + 40px)) max(20px,env(safe-area-inset-left));
    transition:opacity .35s,visibility 0s}
  #hub.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility 0s linear .35s}
  .hub-wrap{width:100%;max-width:1100px;width:min(1100px,100%);margin:auto;text-align:center}
  .logo{display:block;max-width:360px;max-width:min(360px,60vw);max-height:10vh;margin:0 auto 10px;object-fit:contain}
  .brand{margin:0;line-height:1;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
  .brand .l1{display:block;font-size:26px;font-size:clamp(14px,2.2vw,26px);letter-spacing:.35em;color:var(--cyan)}
  .brand .l2{display:block;font-size:86px;font-size:clamp(36px,7vw,86px);margin-top:6px;
    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .datestamp{color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-size:15px;font-size:clamp(11px,1.5vw,15px);margin:18px 0 4px}
  .rule{width:70%;max-width:420px;width:min(420px,70%);height:2px;background:linear-gradient(90deg,transparent,var(--pink),var(--gold),var(--cyan),transparent);margin:16px auto}
  .progress{font-weight:800;font-size:20px;font-size:clamp(15px,2vw,20px);margin:0 0 22px}
  .progress b{color:var(--gold)}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:980px;margin:0 auto;gap:24px;gap:clamp(14px,2vw,24px)}
  .gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    padding:30px 24px;
    padding:clamp(18px,2.6vw,30px) clamp(14px,2vw,24px);border:2px solid var(--line);border-radius:24px;
    background:var(--panel);color:#fff;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.3);
    transition:transform .18s,border-color .18s,background .18s}
  .gcard:hover{transform:translateY(-4px) scale(1.02);border-color:var(--gold);background:rgba(45,22,100,.85)}
  .gcard:focus-visible{transform:translateY(-4px) scale(1.02);border-color:var(--gold);background:rgba(45,22,100,.85)}
  .kbd .gcard:focus{transform:translateY(-4px) scale(1.02);border-color:var(--gold);background:rgba(45,22,100,.85)}
  .gname{font-weight:800;font-size:28px;font-size:clamp(20px,2.4vw,28px);line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
  .gdesc{color:#e9e4ff;font-size:16px;font-size:clamp(13px,1.5vw,16px);line-height:1.45;margin:0;min-height:2.9em}
  .gtoday{color:var(--muted);font-size:14px;font-size:clamp(12px,1.4vw,14px);font-style:italic;min-height:1.4em}
  .gmeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .chip{font-size:12px;font-size:clamp(10.5px,1.2vw,12px);letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.08)}
  .chip.play{background:var(--gold);color:#2a1300;border-color:#ffe39a}
  .chip.part{background:rgba(255,79,154,.25);color:#ffc0dc;border-color:var(--pink)}
  .chip.done{background:rgba(34,201,122,.25);color:#9ff5cb;border-color:var(--green)}
  .gbtn{margin-top:auto;padding-top:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-size:15px;font-size:clamp(13px,1.5vw,15px)}

  /* ---------- Game frames ---------- */
  .frame{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;background:transparent;z-index:5;
    opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s linear .35s;color-scheme:normal}
  .frame.on{opacity:1;visibility:visible;transition:opacity .35s,visibility 0s}

  #loader{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;align-content:center;gap:22px;z-index:50;
    background:rgba(27,15,59,.92);transition:opacity .35s;pointer-events:none;opacity:0}
  #loader.on{opacity:1;pointer-events:auto}
  .ring{width:130px;width:clamp(80px,14vw,130px);height:130px;height:clamp(80px,14vw,130px);border-radius:50%;border:6px solid rgba(255,200,61,.18);
    border-top-color:var(--gold);border-right-color:var(--pink);animation:spin 1s linear infinite}
  .loading-text{letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}
  #copyright{position:fixed;left:0;right:0;bottom:0;z-index:2;text-align:center;font-size:13px;font-size:clamp(10px,1.3vw,13px);
    color:rgba(255,255,255,.7);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none;text-shadow:0 1px 4px #000}

  body.ingame #copyright{display:none}
  @media(max-width:860px){
    .cards{grid-template-columns:1fr;max-width:520px;margin:0 auto}
    .gcard{text-align:left;align-items:stretch}
    .gcard .gtext{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
    .gdesc{min-height:0}
    .gmeta{justify-content:flex-start}
    .gbtn{display:none}
  }
  @media(min-width:861px){ .gtext{display:contents} }
  @media(min-width:1600px){ .cards{grid-template-columns:repeat(4,minmax(0,1fr));max-width:none} .hub-wrap{width:100%;max-width:1500px;width:min(1500px,100%)} }
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  .tv .spot{animation:none!important}
  /* U-NEXT で Universal+ を観る */
  .unext{display:flex;align-items:center;gap:16px;margin:28px auto 0;max-width:560px;padding:14px 20px;border-radius:16px;
    text-decoration:none;color:#fff;background:linear-gradient(90deg,#0b1a2e,#123a6b);border:2px solid #4aa3ff;
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,background .15s}
  .unext:hover,.unext:focus-visible{transform:scale(1.03);border-color:var(--gold);background:linear-gradient(90deg,#10264a,#1a4f92)}
  .kbd .unext:focus{transform:scale(1.03);border-color:var(--gold);outline:4px solid var(--gold);outline-offset:4px}
  .unext img{flex:0 0 auto;height:44px;width:auto;max-width:120px;object-fit:contain}
  .unext-txt{flex:1 1 auto;display:flex;flex-direction:column;text-align:left;line-height:1.5}
  .unext-txt b{font-size:18px;font-size:clamp(15px,1.9vw,18px);font-weight:800}
  .unext-txt small{font-size:13px;color:#cfe3ff}
  .unext-arrow{flex:0 0 auto;font-size:22px;font-weight:800;color:var(--gold)}
  @media(max-width:480px){ .unext{gap:10px;padding:12px 14px} .unext img{height:34px;max-width:90px} }
  @media (orientation:landscape) and (max-height:500px){ .unext{margin-top:14px;padding:8px 14px} .unext img{height:30px} }
  .kbd button:focus{outline:4px solid var(--gold);outline-offset:4px}
  @media (orientation:landscape) and (max-height:500px){
    #hub{padding:14px 18px 40px}
    .logo{max-height:14vh}
    .brand .l2{font-size:clamp(28px,6vw,54px)}
    .datestamp{margin-top:8px}
    .cards{grid-template-columns:repeat(4,minmax(0,1fr));max-width:none}
    .gcard{text-align:center;align-items:center;padding:14px}
    .gmeta{justify-content:center}
    .gdesc{display:none}
  }

  /* ---- Music button ---- */
  #musicBtn{position:fixed;top:12px;right:12px;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
    z-index:60;width:44px;height:44px;padding:0;border-radius:50%;border:2px solid var(--line);background:rgba(30,16,70,.82);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;
    transition:opacity .15s,border-color .15s,transform .15s}
  #musicBtn:hover,#musicBtn:focus{opacity:1;border-color:var(--gold)}
  .kbd #musicBtn:focus{outline:4px solid var(--gold);outline-offset:4px}
  #musicBtn svg{width:22px;height:22px;display:block}
  #musicBtn .off{display:none}
  #musicBtn.muted .on{display:none}
  #musicBtn.muted .off{display:block}
  #musicBtn.muted{opacity:.6}
  #musicBtn.gone{display:none}
  @media(min-width:1600px){ #musicBtn{width:60px;height:60px} #musicBtn svg{width:30px;height:30px} }

  /* ---- Smart TVs: TV video runs on its own hardware layer, which hides it when it is
     behind the page or faded with opacity. Keep it fully opaque on a normal layer and
     dim it with an overlay instead. ---- */
  .tv #bgVideo{z-index:0;opacity:1;transform:none;-webkit-transform:none;backface-visibility:visible;will-change:auto}
  .tv #bgOverlay{z-index:1;background:linear-gradient(135deg,rgba(27,15,59,.8),rgba(43,17,102,.78) 55%,rgba(13,59,122,.8))}
  .tv #hub{z-index:2}
  .tv .spot{display:none}

  /* ===== 日本語ローカライズ: タイポグラフィ ===== */
  html,body,button,input{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif}
  body{line-height:1.7;line-break:strict;overflow-wrap:anywhere;word-break:normal}
  *,*::before,*::after{font-style:normal!important;text-transform:none!important}
  p,li,.tagline,.tip,.msg,.chiprule,.gdesc,.qtext,.review div,.cast li,.chain li,.legend li,.sub,.banner,.streak-banner,
  .archive-head p,.dc-films,.dc-meta,.movie-meta,.feedback,.points,.verdict,.archive-flag,.replay-flag,.theme-pill,.progress{line-height:1.7}
  /* 欧文向けの広い字間は和文では読みにくいので詰める */
  .datestamp,.day-no,.dc-no,.stat span,.archive-stats span,.loading-text,.next-in,.panel h3,.solution h4,.chip,.dc-status,
  .brand .of,.brand .l1,.brand .l3,.qnum,.round-sub,.meter,.wd,.rcard .no,.rcard .st,.score small,.timer,.gbtn,.slot .gn{letter-spacing:.06em!important}
  .brand,.brand .l2,.title,.gname,.btn,.actor,.verdict-line,.archive-head h2{letter-spacing:.02em!important}
  .brand .of{font-size:.34em}
  /* LINE / X シェア */
  .social{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px}
  .social .btn{min-width:150px}
  .btn.line{background:#06C755;border-color:#06C755;color:#fff}
  .btn.xpost{background:#111;border-color:#555;color:#fff}
  .btn.line:hover:not(:disabled),.btn.line:focus-visible{background:#05b14c;border-color:#fff}
  .btn.xpost:hover:not(:disabled),.btn.xpost:focus-visible{background:#333;border-color:#fff}
  .tv .social,.tv .line,.tv .xpost{display:none!important}
  /* U-NEXT で Universal+ を観る */
  .unext{display:flex;align-items:center;gap:16px;margin:22px auto 0;max-width:560px;padding:14px 20px;border-radius:16px;
    text-decoration:none;color:#fff;background:linear-gradient(90deg,#0b1a2e,#123a6b);border:2px solid #4aa3ff;
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,background .15s}
  .unext:hover,.unext:focus-visible{transform:scale(1.03);border-color:var(--gold);background:linear-gradient(90deg,#10264a,#1a4f92)}
  .kbd .unext:focus{transform:scale(1.03);border-color:var(--gold);outline:4px solid var(--gold);outline-offset:4px}
  .unext img{flex:0 0 auto;height:44px;width:auto;max-width:120px;object-fit:contain}
  .unext-txt{flex:1 1 auto;display:flex;flex-direction:column;text-align:left;line-height:1.5}
  .unext-txt b{font-size:18px;font-size:clamp(15px,1.9vw,18px);font-weight:800}
  .unext-txt small{font-size:13px;color:#cfe3ff}
  .unext-arrow{flex:0 0 auto;font-size:22px;font-weight:800;color:var(--gold)}
  @media(max-width:480px){ .unext{gap:10px;padding:12px 14px} .unext img{height:34px;max-width:90px} }
  .brand .l2{font-size:76px;font-size:clamp(34px,6.4vw,76px)}
</style>
</head>
<body>
<video id="bgVideo" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture>
  <source src="cinema.mp4" type="video/mp4">
</video>
<div id="bgOverlay"></div>
<div id="bg"></div>
<div class="spot a"></div><div class="spot b"></div>

<section id="hub">
  <main class="hub-wrap">
    <img class="logo" src="logo_white.png" alt="Universal+ ロゴ" onerror="this.style.display='none'">
    <h1 class="brand"><span class="l2">デイリーゲーム</span></h1>
    <p class="datestamp" id="hubDate"></p>
    <div class="rule"></div>
    <p class="progress" id="hubProgress"></p>
    <div class="cards" id="cards">
      <button class="gcard g-trivia" type="button" data-game="trivia">
        <span class="gtext">
          <span class="gname">シネマニアック</span>
          <span class="gdesc">毎日ひとつのテーマで全10問。すばやく答えるとボーナスポイント。</span>
          <span class="gtoday" id="today-trivia"></span>
          <span class="gmeta"><span class="chip" id="chip-trivia"></span><span class="chip" id="streak-trivia"></span></span>
        </span>
        <span class="gbtn">プレイ &rarr;</span>
      </button>
      <button class="gcard g-blockbuster" type="button" data-game="blockbuster">
        <span class="gtext">
          <span class="gname">ブロックバスター</span>
          <span class="gdesc">5本の映画と5人のスター。行・列・色ごとに1人、隣り合わないように配置。</span>
          <span class="gtoday" id="today-blockbuster"></span>
          <span class="gmeta"><span class="chip" id="chip-blockbuster"></span><span class="chip" id="streak-blockbuster"></span></span>
        </span>
        <span class="gbtn">プレイ &rarr;</span>
      </button>
      <button class="gcard g-starcrossed" type="button" data-game="starcrossed">
        <span class="gtext">
          <span class="gname">スタークロス</span>
          <span class="gdesc">今日の映画のスターのフルネームを、カタカナでクロスワードに。</span>
          <span class="gtoday" id="today-starcrossed"></span>
          <span class="gmeta"><span class="chip" id="chip-starcrossed"></span><span class="chip" id="streak-starcrossed"></span></span>
        </span>
        <span class="gbtn">プレイ &rarr;</span>
      </button>
      <button class="gcard g-ladder" type="button" data-game="ladder">
        <span class="gtext">
          <span class="gname">スタージャンプ</span>
          <span class="gdesc">7人のスターと6本の映画。共演作でとなり同士をつなぎましょう。</span>
          <span class="gtoday" id="today-ladder"></span>
          <span class="gmeta"><span class="chip" id="chip-ladder"></span><span class="chip" id="streak-ladder"></span></span>
        </span>
        <span class="gbtn">プレイ &rarr;</span>
      </button>
    </div>
    <a class="unext" href="https://video.unext.jp/brand/universal-plus" target="_blank" rel="noopener noreferrer" aria-label="U-NEXTでUniversal+を観る（新しいタブで開きます）"><img src="logo_white.png" alt="Universal+" onerror="this.style.display='none'"><span class="unext-txt"><b>U-NEXTでUniversal+を観る</b><small>配信中の作品をチェック</small></span><span class="unext-arrow" aria-hidden="true">&rarr;</span></a>
  </main>
</section>

<div id="frames"></div>
<div id="loader" role="status" aria-live="polite"><div class="ring"></div><div class="loading-text">上映準備中&hellip;</div></div>
<audio id="bgm" loop preload="auto"><source src="background_music.mp3" type="audio/mpeg"></audio>
<button id="musicBtn" type="button" aria-label="BGMをオフにする" aria-pressed="true" title="BGM オン（Mキー）">
  <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/></svg>
</button>

<!-- Each game is a complete, self-contained page loaded into its own frame on demand -->

background:radial-gradient(circle,rgba(255,79,154,.55),transparent 65%);top:-40vmax;left:-30vmax}\n  .spot.b{background:radial-gradient(circle,rgba(51,214,255,.5),transparent 65%);bottom:-40vmax;right:-30vmax;animation-delay:-9s}\n  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(10vmax,8vmax,0)}}\n  #bgVideo{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.22;z-index:-2;\n    transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;pointer-events:none}\n  #bgVideo.failed{display:none}\n  #bgOverlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;\n    background:linear-gradient(180deg,rgba(27,15,59,0),rgba(27,15,59,.35))}\n\n  /* ---------- Screens ---------- */\n  .screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;\n    padding:24px 24px\n            56px 24px;\n    padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))\n            max(56px,calc(env(safe-area-inset-bottom) + 38px)) max(24px,env(safe-area-inset-left));\n    transition:transform .65s cubic-bezier(.22,.8,.25,1),opacity .45s,visibility 0s;\n    overflow:auto;-webkit-overflow-scrolling:touch;overflow-anchor:none;scroll-behavior:auto}\n  .hidden-left,.hidden-right{opacity:0;pointer-events:none;visibility:hidden;\n    transition:transform .65s cubic-bezier(.22,.8,.25,1),opacity .45s,visibility 0s linear .65s}\n  .hidden-left{transform:translateX(-105%)}\n  .hidden-right{transform:translateX(105%)}\n\n  /* ---------- Landing ---------- */\n  .landing-content{width:100%;max-width:940px;width:min(940px,100%);text-align:center;margin:auto}\n  .logo{display:block;max-width:520px;max-width:min(520px,75vw);max-height:10vh;margin:0 auto 12px;margin:0 auto clamp(4px,1vh,12px);object-fit:contain}\n  .small-logo{display:block;max-width:200px;max-width:min(200px,42vw);max-height:10vh;margin:0 auto;object-fi x;font-size:clamp(24px,3.4vw,40px);margin:4px 0 0;line-height:1.05;font-weight:800;text-transform:uppercase;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .timer{font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.14em;font-size:16px;font-size:clamp(13px,1.7vw,16px);font-weight:700}\n  .archive-flag{display:none;padding:10px 16px;border-radius:12px;background:rgba(255,200,61,.12);\n    border:1px solid rgba(255,200,61,.35);font-size:15px;font-size:clamp(12px,1.6vw,15px);font-weight:700;color:#ffe7a8}\n  .archive-flag.on{display:block}\n  .rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n  .play{display:flex;flex-direction:column;align-items:center;gap:18px}\n  .side{width:var(--bs);display:flex;flex-direction:column;gap:14px}\n\n  /* Movie card */\n  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px;padding:clamp(14px,2vw,20px)}\n  .panel h3{margin:0 0 12px;font-size:13px;font-size:clamp(11px,1.4vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:800}\n  .movie-name{font-size:28px;font-size:clamp(20px,2.6vw,28px);font-weight:800;line-height:1.15;margin:0}\n  .movie-meta{color:var(--muted);font-size:15px;font-size:clamp(13px,1.6vw,15px);margin:4px 0 0}\n\n  /* ---------- Solution ---------- */\n  .solution{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;padding:clamp(20px,3vw,32px);animation:cardIn .5s forwards}\n  @keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}\n  .verdict-line{font-size:56px;font-size:clamp(28px,4.6vw,56px);font-weight:900;margin:0 0 6px;line-height:1.1;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .sub{font-size:22px;font-size:clamp(16px,2.1vw,22px);margin:0 0 18px;color:var(--gold);font-weight:800}\n  .solution h4{margin:18px 0 10px;font-size:13px;font-size:clamp(11px,1.5vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}\n  .cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}\n  .cast li{font-size:17px;font-size:clamp(14px,1.8vw,17px);line-height:1.4;color:#f1edff}\n  .cast b{color:var(--cyan);margin-right:6px}\n  .streak-banner{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 0;padding:16px;border-radius:14px;\n    background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);font-weight:800;font-size:20px;font-size:clamp(15px,2vw,20px);flex-wrap:wrap;text-align:center}\n  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;gap:clamp(14px,2.4vw,24px);margin-top:24px}\n  .next-in{text-align:center;color:var(--muted);margin-top:22px;letter-spacing:.16em;text-transform:uppercase;\n    font-size:13px;\n    font-size:clamp(10.5px,1.4vw,13px);font-variant-numeric:tabular-nums}\n  .confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;pointer-events:none;animation:fall linear forwards}\n  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}\n\n  /* ---------- Archive ---------- */\n  #archive{align-items:flex-start}\n  .archive-wrap{width:100%;max-width:1180px;width:min(1180px,100%);margin:auto;display:flex;flex-direction:column;gap:22px;gap:clamp(14px,2.2vh,22px)}\n  .archive-head{text-align:center}\n  .archive-head h2{font-size:46px;font-size:clamp(26px,4vw,46px);margin:0 0 8px;font-weight:800;text-transform:uppercase}\n  .archive-head p{color:var(--muted);margin:0;font-size:16px;font-size:clamp(13px,1.7vw,16px)}\n  .archive-stats{display:flex;justify-content:center;gap:34px;gap:clamp(14px,3vw,34px);flex-wrap:wrap;padding:14px 0;\n    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n  .archive-stats div{text-align:center}\n osition:fixed;left:0;right:0;bottom:0;z-index:6;text-align:center;font-size:13px;font-size:clamp(10px,1.3vw,13px);\n    color:rgba(255,255,255,.7);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none;text-shadow:0 1px 4px #000}\n  #loader{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;align-content:center;gap:26px;background:var(--navy);z-index:9999;\n    transition:opacity .5s ease;padding:24px;text-align:center}\n  #loader.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}\n  .spinner{position:relative;width:160px;width:clamp(110px,18vw,160px);height:160px;height:clamp(110px,18vw,160px);display:grid;place-items:center}\n  .spinner .ring{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:5px solid rgba(255,200,61,.18);border-top-color:var(--gold);border-right-color:var(--pink);animation:spin 1s linear infinite}\n  .spinner img{width:62%;height:62%;object-fit:contain;animation:pulse 1.6s ease-in-out infinite}\n  .loading-text{font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-size:14px;font-size:clamp(11px,1.5vw,14px)}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1);opacity:1}}\n\n  /* ---------- Ladder ---------- */\n  .play{display:flex;flex-direction:column;align-items:center;gap:16px}\n  .ladder{width:100%;max-width:560px;width:min(560px,100%);display:flex;flex-direction:column;align-items:stretch;gap:0;\n    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  .rung{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;\n    min-height:50px;padding:8px 14px;font-weight:800;line-height:1.2}\n  .actor{background:var(--panel);border:2px solid rgba(51,214,255,.55);color:#fff;\n    font-size:19px;font-size:clamp(15px,1.9vw,19px);letter-spacing:.06em;text-transform:uppercase}\n  .actor.end{border-color:var(--gold);background:rgba(255,200,61,.14)}\n  .link{width:4px;height:12px;margin:0 auto;background:linear-gradient(var(--cyan),var(--pink));border-radius:2px}\n  .slot{width:100%;border:2px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;\n    font-size:16px;font-size:clamp(14px,1.7vw,16px);font-style:italic;font-weight:700;transition:background .15s,border-color .15s,transform .15s;touch-action:none}\n  .slot .gn{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.14em;color:var(--cyan);font-style:normal}\n  .slot.filled{border-style:solid;border-color:var(--gold);background:#ffe7a8;color:#2a1300;font-style:normal;font-weight:800}\n  .slot.filled .gn{color:#7a6aa8}\n  .slot.ready{border-color:var(--cyan);background:rgba(51,214,255,.14)}\n  .slot.over{border-color:var(--pink);background:rgba(255,79,154,.25);transform:scale(1.02)}\n  .slot.right{border-color:var(--green);background:#bff5d9;color:#0b3d22}\n  .slot.wrong{border-color:var(--red);background:#ff9d9d;color:#5a0000;animation:shake .4s}\n  .slot.locked{cursor:default}\n  .slot:hover:not(.locked){border-color:var(--gold)}\n  .slot:focus-visible{outline:4px solid var(--pink);outline-offset:2px}\n  .kbd .slot:focus{outline:4px solid var(--pink);outline-offset:2px}\n  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}\n\n  .side{width:100%;max-width:560px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}\n  .tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  .tile{min-height:52px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:rgba(30,16,70,.9);color:#fff;\n    font-weight:800;font-size:15px;font-size:clamp(13px,1.6vw,15px);line-height:1.2;cursor:grab;touch-action:none;\n    transition:transform .15s,border-color .15s,background .15s,opacity .15s}\n  .tile:hover:not(:disabled){border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .tile:focus-visible{border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .tile:focus{border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .tile.sel{border-color:var(--gold);background:rgba(255,200,61,.25);box-shadow:0 0 0 2px var(--gold) inset}\n  .tile.used{opacity:.3}\n  .tile.dragging{opacity:.3}\n  .tile:disabled{cursor:default}\n  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n  .msg{min-height:1.4em;text-align:center;font-weight:700;font-size:16px;font-size:clamp(13.5px,1.7vw,16px);color:#ffb3ad;margin:0}\n  .msg.good{color:#9ff5cb}\n  .tip{color:var(--muted);font-size:14px;font-size:clamp(12.5px,1.5vw,14px);line-height:1.45;margin:0;text-align:center}\n  .meter{display:flex;justify-content:center;gap:18px;color:var(--muted);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}\n  .meter b{color:var(--gold)}\n  .drag-ghost{position:fixed;left:0;top:0;z-index:10000;pointer-events:none;padding:10px 16px;border-radius:14px;\n    background:var(--bg2);color:#fff;border:3px solid var(--gold);font-weight:800;font-size:16px;\n    box-shadow:0 12px 30px rgba(0,0,0,.5);white-space:nowrap;will-change:transform}\n  body.is-dragging,body.is-dragging *{cursor:grabbing!important}\n  .chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;text-align:center}\n  .chain li{font-size:16px;font-size:clamp(13.5px,1.7vw,16px);color:#f1edff}\n  .chain li.m{color:var(--gold);font-weight:800}\n\n  /* ---------- Responsive ---------- */\n  @media(min-width:960px){\n    .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px}\n    .side{width:400px;width:min(400px,36vw);position:sticky;top:0}\n    .tray{grid-template-columns:1fr}\n  }\n  @media(max-width:959px){\n    .side{order:-1;position:sticky;top:-24px;z-index:3;padding:10px;border-radius:18px;background:rgba(27,15,59,.94);border:1px solid var(--line)}\n    .side .tip{display:none}\n    .rung{min-height:42px;padding:6px 10px}\n    .link{height:8px}\n    .tile{min-height:44px}\n  }\n  @media(max-width:760px){\n    .rules,.how{grid-template-columns:repeat(2,minmax(0,1fr))}\n    #game .rules{display:none}\n    .actions{grid-template-columns:1fr}\n    .screen{padding:18px 14px 52px}\n    .archive-grid{grid-template-columns:1fr}\n    .controls{grid-template-columns:repeat(3,1fr)}\n  }\n  @media(min-width:1600px){\n    .screen{padding:5vh 7vw 7vh}\n    .btn{min-height:68px}\n    .ladder{max-width:760px}\n    .side{width:520px}\n    .rung{min-height:62px}\n    .tile{min-height:62px;font-size:19px}\n  }\n  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n\n  /* ---- embedded in the Daily Movie Games hub ---- */\n  html,body{background:transparent!important}\n  #bg,.spot,#bgOverlay,#bgVideo{display:none!important}\n  body:not(.on-landing) #copyright{display:none}\n  .tv #landingShareBtn,.tv #shareBtn{display:none!important}\n  .tv .spot,.tv .confetti{animation:none!important}\n  .kbd button:focus{outline:4px solid var(--gold);outline-offset:4px}\n  .topbar,.top{padding-right:56px}\n  @media(min-width:1600px){ .topbar,.top{padding-right:76px} }\n\n  /* ===== 日本語ローカライズ: タイポグラフィ ===== */\n  html,body,button,input{font-family:\"Noto Sans JP\",\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"BIZ UDPGothic\",\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif}\n  body{line-height:1.7;line-break:strict;overflow-wrap:anywhere;word-break:normal}\n  *,*::before,*::after{font-style:normal!important;text-transform:none!important}\n  p,li,.tagline,.tip,.msg,.chiprule,.gdesc,.qtext,.review div,.cast li,.chain li,.legend li,.sub,.banner,.streak-banner,\n  .archive-head p,.dc-films,.dc-meta,.movie-meta,.feedback,.points,.verdict,.archive-flag,.replay-flag,.theme-pill,.progress{line-height:1.7}\n  /* 欧文向けの広い字間は和文では読みにくいので詰める */\n  .datestamp,.day-no,.dc-no,.stat span,.archive-stats span,.loading-text,.next-in,.panel h3,.solution h4,.chip,.dc-status,\n  .brand .of,.brand .l1,.brand .l3,.qnum,.round-sub,.meter,.wd,.rcard .no,.rcard .st,.score small,.timer,.gbtn,.slot .gn{letter-spacing:.06em!important}\n  .brand,.brand .l2,.title,.gname,.btn,.actor,.verdict-line,.archive-head h2{letter-spacing:.02em!important}\n  .brand .of{font-size:.34em}\n  /* LINE / X シェア */\n  .social{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px}\n  .social .btn{min-width:150px}\n  .btn.line{background:#06C755;border-color:#06C755;color:#fff}\n  .btn.xpost{background:#111;border-color:#555;color:#fff}\n  .btn.line:hover:not(:disabled),.btn.line:focus-visible{background:#05b14c;border-color:#fff}\n  .btn.xpost:hover:not(:disabled),.btn.xpost:focus-visible{background:#333;border-color:#fff}\n  .tv .social,.tv .line,.tv .xpost{display:none!important}\n  /* U-NEXT で Universal+ を観る */\n  .unext{display:flex;align-items:center;gap:16px;margin:22px auto 0;max-width:560px;padding:14px 20px;border-radius:16px;\n    text-decoration:none;color:#fff;background:linear-gradient(90deg,#0b1a2e,#123a6b);border:2px solid #4aa3ff;\n    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,background .15s}\n  .unext:hover,.unext:focus-visible{transform:scale(1.03);border-color:var(--gold);background:linear-gradient(90deg,#10264a,#1a4f92)}\n  .kbd .unext:focus{transform:scale(1.03);border-color:var(--gold);outline:4px solid var(--gold);outline-offset:4px}\n  .unext img{flex:0 0 auto;height:44px;width:auto;max-width:120px;object-fit:contain}\n  .unext-txt{flex:1 1 auto;display:flex;flex-direction:column;text-align:left;line-height:1.5}\n  .unext-txt b{font-size:18px;font-size:clamp(15px,1.9vw,18px);font-weight:800}\n  .unext-txt small{font-size:13px;color:#cfe3ff}\n  .unext-arrow{flex:0 0 auto;font-size:22px;font-weight:800;color:var(--gold)}\n  @media(max-width:480px){ .unext{gap:10px;padding:12px 14px} .unext img{height:34px;max-width:90px} }\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"on-landing\">\n\u003cdiv id=\"bg\">\u003c/div>\n\n\u003c!-- ============ LANDING ============ -->\n\u003csection id=\"landing\" class=\"screen\">\n  \u003cmain class=\"landing-content\">\n    \u003cimg class=\"logo\" src=\"logo_white.png\" alt=\"ロゴ\" onerror=\"this.style.display='none'\">\n    \u003ch1 class=\"brand\">スタージャンプ\u003cspan class=\"of\">映画でスターをつなぐ毎日のパズル\u003c/span>\u003c/h1>\n    \u003cdiv class=\"rule\">\u003c/div>\n    \u003cp class=\"datestamp\" id=\"landingDate\">\u003c/p>\n    \u003cp class=\"tagline\" id=\"landingTag\">7人のスターと6本の映画。共演作でつないで、はしごを上りましょう。\u003c/p>\n    \u003cdiv class=\"how\">\n      \u003cdiv class=\"chiprule\">空欄は2人のスターのあいだにあります\u003c/div>\n      \u003cdiv class=\"chiprule\">映画をドラッグ、またはタップして空欄へ\u003c/div>\n      \u003cdiv class=\"chiprule\">上下のスターが両方出演している映画が正解\u003c/div>\n      \u003cdiv class=\"chiprule\">最後の空欄を埋めると自動で答え合わせ\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stats\">\n      \u003cdiv class=\"stat\">\u003cb id=\"statStreak\">0\u003c/b>\u003cspan>連続日数\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statBest\">0\u003c/b>\u003cspan>最高記録\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statSolved\">0\u003c/b>\u003cspan>クリア\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"landing-actions\">\n      \u003cbutton id=\"startBtn\" class=\"btn primary btn-lg\" type=\"button\">今日のパズルに挑戦\u003c/button>\n      \u003cdiv class=\"landing-row\">\n        \u003cbutton id=\"landingArchiveBtn\" class=\"btn ghost\" type=\"button\">過去のパズル\u003c/button>\n        \u003cbutton id=\"landingShareBtn\" class=\"btn ghost\" type=\"button\">シェア\u003c/button>\n        \u003cbutton id=\"landingLineBtn\" class=\"btn ghost line\" type=\"button\">LINE\u003c/button>\n        \u003cbutton id=\"landingXBtn\" class=\"btn ghost xpost\" type=\"button\">X\u003c/button>\n        \u003cbutton id=\"hubBtn\" class=\"btn ghost\" type=\"button\">ゲーム一覧\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ GAME ============ -->\n\u003csection id=\"game\" class=\"screen hidden-right\">\n  \u003cmain class=\"wrap\">\n    \u003cdiv class=\"archive-flag\" id=\"archiveFlag\">\u003c/div>\n    \u003cheader class=\"top\">\n      \u003cdiv>\n        \u003cdiv class=\"day-no\" id=\"dayNo\">\u003c/div>\n        \u003ch2 class=\"title\">スタージャンプ\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"timer\" id=\"timer\">0:00\u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"rules\">\n      \u003cdiv class=\"chiprule\">空欄は2人のスターのあいだにあります\u003c/div>\n      \u003cdiv class=\"chiprule\">映画をドラッグ、またはタップして空欄へ\u003c/div>\n      \u003cdiv class=\"chiprule\">上下のスターが両方出演している映画が正解\u003c/div>\n      \u003cdiv class=\"chiprule\">最後の空欄を埋めると自動で答え合わせ\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"play\">\n      \u003cdiv class=\"ladder\" id=\"ladder\" aria-label=\"映画のはしご\">\u003c/div>\n      \u003cdiv class=\"side\">\n        \u003cdiv class=\"tray\" id=\"tray\">\u003c/div>\n        \u003cdiv class=\"meter\">\u003cspan>ミス \u003cb id=\"mistakes\">0\u003c/b>\u003c/span>\u003cspan>ヒント \u003cb id=\"hints\">0\u003c/b>\u003c/span>\u003c/div>\n        \u003cp class=\"msg\" id=\"msg\" aria-live=\"polite\">\u003c/p>\n        \u003cdiv class=\"controls\">\n          \u003cbutton id=\"hintBtn\" class=\"btn sm\" type=\"button\">ヒント\u003c/button>\n          \u003cbutton id=\"resetBtn\" class=\"btn sm\" type=\"button\">クリア\u003c/button>\n          \u003cbutton id=\"gameHomeBtn\" class=\"btn sm\" type=\"button\">ホーム\u003c/button>\n        \u003c/div>\n        \u003cp class=\"tip\">映画を空欄にドラッグするか、映画をタップしてから空欄をタップしてください。埋めた空欄をタップすると映画が戻ります。最後の空欄を埋めると自動で答え合わせをし、正解は緑色で固定されます。\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"solutionSlot\">\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ ARCHIVE ============ -->\n\u003csection id=\"archive\" class=\"screen hidden-right\">\n  \u003cmain class=\"archive-wrap\">\n    \u003cdiv class=\"archive-head\">\n      \u003ch2>過去のパズル\u003c/h2>\n      \u003cp>初日からのパズルがすべてそろっています。見逃した日もプレイできます。\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"archive-stats\">\n      \u003cdiv>\u003cb id=\"arcSolved\">0\u003c/b>\u003cspan>クリア\u003c/span>\u003c/div>\n      \u003cdiv>\u003cb id=\"arcProgress\">0\u003c/b>\u003cspan>プレイ中\u003c/span>\u003c/div>\n      \u003cdiv>\u003cb id=\"arcOpen\">0\u003c/b>\u003cspan>未プレイ\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"archive-grid\" id=\"archiveGrid\">\u003c/div>\n    \u003cdiv class=\"archive-foot\">\u003cbutton id=\"arcHomeBtn\" class=\"btn\" type=\"button\">ホームへ戻る\u003c/button>\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003cfooter id=\"copyright\">&copy; \u003cspan id=\"year\">\u003c/span> NBCUniversal・毎日新しいパズルをお届けします\u003c/footer>\n\n\u003cscript>\n\n/* ---------- Compatibility: older smart-TV browsers (Chrome 53+) ---------- */\nif(!String.prototype.padStart){\n  String.prototype.padStart = function(n, s){\n    var t = String(this); if(t.length >= n) return t;\n    s = s === undefined ? ' ' : String(s); if(!s) return t;\n    var p = ''; while(p.length \u003c n - t.length) p += s;\n    return p.slice(0, n - t.length) + t;\n  };\n}\nif(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;\n\n/* ===== 日本語ローカライズ: 日付・数値（Intl ja-JP） ===== */\nvar JA_LONG = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });\nvar JA_SHORT = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'numeric', day:'numeric' });\nvar JA_NUM = new Intl.NumberFormat('ja-JP');\nvar JA_COMPACT = (function(){ try{ return new Intl.NumberFormat('ja-JP', { notation:'compact', maximumFractionDigits:1 }); }catch(e){ return JA_NUM; } })();\nfunction fmtNum(n){ return Math.abs(n) >= 10000 ? JA_COMPACT.format(n) : JA_NUM.format(n); }   /* 1万以上は「1.2万」「3億」表記 */\nfunction dayLabel(n){ return n + '日目'; }\nfunction fmtTimeJa(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60), r = s % 60; return (m ? m + '分' : '') + r + '秒'; }\n/* ======================================================================\n   MOVIE LADDER - daily actor/movie ladder.\n   Each day shows the next ladder from LADDERS (day 1 = row 1),\n   looping after the last row. Any movie whose cast includes both\n   neighbouring actors is accepted.\n   ====================================================================== */\nconst START_DATE = '2026-10-01';      // day 1\nconst STORE_KEY  = 'umg.ladder.v1';\nconst UMG_HOST = /*UMG_HOST*/null || { protocol: location.protocol, url: location.href };\nconst IS_TV = !!UMG_HOST.tv || /SMART-TV|SmartTV|Tizen|Web0S|webOS|WebOS|NetCast|LG Browser|HbbTV|BRAVIA|Sony|CrKey|GoogleTV|Google TV|Android TV|AndroidTV|AFT[A-Z]|Roku|VIDAA|Viera|Panasonic|AQUOS|Sharp|PhilipsTV|Philips|TPV|Hisense|Vizio|Opera TV|OMI|Vewd|Titan|Freeview|\\bTV\\b/i.test(navigator.userAgent);\n/* ---------- Input mode: show focus rings for remotes/keyboards, hide them for touch/mouse ---------- */\n(function(){\n  var root = document.documentElement;\n  if(IS_TV) root.classList.add('tv', 'kbd');\n  document.addEventListener('keydown', function(e){\n    if(/^(Arrow|Enter|Tab|Up|Down|Left|Right)/.test(e.key || '') || (e.keyCode >= 37 && e.keyCode \u003c= 40) || e.keyCode === 13) root.classList.add('kbd');\n  }, true);\n  document.addEventListener('pointerdown', function(e){ if(!IS_TV && e.pointerType) root.classList.remove('kbd'); }, true);\n})();\n\n/* Back button on every remote: Samsung Tizen (10009), LG webOS (461), Android/Fire TV, keyboards */\nvar BACK_KEYS = ['Escape','BrowserBack','GoBack','Back','XF86Back','Backspace'];\nvar BACK_CODES = [10009, 461, 166, 27, 8];\nfunction isBackKey(e){ return BACK_KEYS.indexOf(e.key) !== -1 || BACK_CODES.indexOf(e.keyCode) !== -1; }\n/* ---------- TV remotes: some TV browsers send old key names / codes; normalise them ---------- */\nvar KEY_ALIAS = { Left:'ArrowLeft', Up:'ArrowUp', Right:'ArrowRight', Down:'ArrowDown' };\nvar KEY_CODES = { 37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 13:'Enter' };\nfunction normKey(e){\n  var k = e.key;\n  if(KEY_ALIAS[k]) return KEY_ALIAS[k];\n  if((!k || k === 'Unidentified') && KEY_CODES[e.keyCode]) return KEY_CODES[e.keyCode];\n  return null;\n}\nfunction synthKey(target, k, code){\n  var ev;\n  try{ ev = new KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true }); }\n  catch(x){ ev = document.createEvent('Event'); ev.initEvent('keydown', true, true); try{ Object.defineProperty(ev, 'key', { get:function(){ return k; } }); }catch(y){} }\n  try{ Object.defineProperty(ev, 'keyCode', { get:function(){ return code || 0; } }); }catch(x){}\n  ev.umgSynthetic = true;\n  (target || document.body).dispatchEvent(ev);\n}\n\nfunction firstButton(){\n  var l = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'))\n    .filter(function(b){ return b.offsetParent !== null; });\n  return l[0] || null;\n}\nfunction fireKey(k, code){\n  document.documentElement.classList.add('kbd');\n  var t = document.activeElement;\n  if(!t || t === document.body || t === document.documentElement){\n    var f = firstButton();\n    if(f){ try{ f.focus({ preventScroll:true }); }catch(x){ f.focus(); } if(/^Arrow/.test(k)) return; t = f; }\n  }\n  if(k === 'Enter'){ if(t && t.tagName === 'BUTTON' && !t.disabled) t.click(); return; }\n  synthKey(t, k, code);\n}\nwindow.addEventListener('keydown', function(e){\n  if(e.umgSynthetic) return;\n  if(e.key === 'm' || e.key === 'M'){ try{ parent.postMessage({ umg:'music' }, '*'); }catch(x){} return; }\n  var k = normKey(e); if(!k) return;\n  e.preventDefault(); e.stopImmediatePropagation();\n  fireKey(k, e.keyCode);\n}, true);\n/* Keys pressed while the TV gave focus to the hub page are forwarded here */\nwindow.addEventListener('message', function(e){\n  var d = e.data || {}; if(d.umg !== 'key') return;\n  var k = KEY_ALIAS[d.key] || d.key;\n  if((!k || k === 'Unidentified') && KEY_CODES[d.code]) k = KEY_CODES[d.code];\n  if(k) fireKey(k, d.code);\n});\n/* Let the hub know about taps/presses here so it can start the video and music (browsers need a gesture) */\n(function(){\n  var last = 0;\n  function g(){ var n = Date.now(); if(n - last \u003c 800) return; last = n; try{ parent.postMessage({ umg:'gesture' }, '*'); }catch(x){} }\n  ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ window.addEventListener(ev, g, { capture:true, passive:true }); });\n})();\n\n\n\n\n\n/* [ [7 actors], [6 movies in order], [for each gap: indexes of movies that fit it] ] */\nconst LADDERS = /*LADDER_DATA*/null;\n\n/* ---------- Helpers ---------- */\nconst MS_DAY = 86400000;\nconst $ = s => document.querySelector(s);\nconst esc = str => String(str).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst localMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();\nconst parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getTime(); };\nconst toISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\nconst dayNumberFor = d => Math.round((localMidnight(d) - parseISO(START_DATE)) / MS_DAY) + 1;\nconst dateForDay = n => { const b = new Date(parseISO(START_DATE)); return new Date(b.getFullYear(), b.getMonth(), b.getDate() + n - 1); };\nconst isoForDay = n => toISO(dateForDay(n));\nconst fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');\nconst longDate = d => JA_LONG.format(d);\nconst shortDate = d => JA_SHORT.format(d);\n\nfunction mulberry(a){\n  return function(){\n    a |= 0; a = a + 0x6D2B79F5 tore.streak : 1);\n      store.lastPlayedISO = todayISO;\n      store.best = Math.max(store.best, store.streak);\n    }\n    saveStore();\n  }\n  setMsg('');\n  paint(); confetti(); renderSolution();\n  scrollToEl($('#game'), $('#solutionSlot'));\n}\nfunction confetti(){\n  if(IS_TV) return;\n  const cols = ['#ffc83d','#ff4f9a','#33d6ff','#22c97a','#9b7bff'];\n  for(let i = 0; i \u003c 80; i++){\n    const c = document.createElement('i');\n    c.className = 'confetti';\n    c.style.left = Math.random() * 100 + 'vw';\n    c.style.background = cols[i % cols.length];\n    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';\n    c.style.animationDelay = Math.random() * .8 + 's';\n    document.body.appendChild(c);\n    setTimeout(() => c.remove(), 6000);\n  }\n}\nfunction verdict(m, h){\n  if(!m && !h) return 'ノーミスでゴール！';\n  if(m + h \u003c= 1) return 'おみごとです！';\n  if(m + h \u003c= 3) return 'ゴールしました！';\n  return 'おつかれさまでした！';\n}\nfunction renderSolution(){\n  const res = store.results[iso];\n  const time = replay ? st.elapsed : res.t, miss = replay ? st.miss : res.m, hints = replay ? st.hints : res.h;\n  let chain = '';\n  for(let i = 0; i \u003c 7; i++){\n    chain += '\u003cli>' + esc(P.actors[i]) + '\u003c/li>';\n    if(i \u003c 6) chain += '\u003cli class=\"m\">\\u2195 ' + esc(P.movies[st.at[i] >= 0 ? st.at[i] : i]) + '\u003c/li>';\n  }\n  const banner = replay ? 'リプレイ・最初の結果はそのまま残ります'\n    : isToday ? '\\u{1F525} ' + displayStreak() + '日連続・クリア ' + store.solved + '回'\n    : '\\u{1F5C3} 過去のパズル・連続日数はそのまま・クリア ' + store.solved + '回';\n  $('#solutionSlot').innerHTML =\n    '\u003csection class=\"solution\">' +\n      '\u003cp class=\"verdict-line\">' + verdict(miss, hints) + '\u003c/p>' +\n      '\u003cp class=\"sub\">' + fmtTimeJa(time) + '・ミス' + miss + '回・' + (hints ? 'ヒント' + hints + '回' : 'ヒントなし') + '\u003c/p>' +\n      '\u003ch4>今日のはしご\u003c/h4>\u003cul class=\"chain\">' + chain + '\u003c/ul>' +\n      '\u003cdiv class=\"streak-banner\">' + banner + '\u003c/div>' +\n      '\u003cdiv class=\"actions\">' +\n        '\u003cbutton id=\"shareBtn\" class=\"btn\" type=\"button\">結果をシェア\u003c/button>' +\n        '\u003cbutton id=\"againBtn\" class=\"btn\" type=\"button\">もう一度遊ぶ\u003c/button>' +\n        '\u003cbutton id=\"archiveBtn\" class=\"btn\" type=\"button\">過去のパズル\u003c/button>' +\n        '\u003cbutton id=\"homeBtn\" class=\"btn primary\" type=\"button\">ホームへ戻る\u003c/button>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"social\">\u003cbutton id=\"lineBtn\" class=\"btn line\" type=\"button\">LINEで送る\u003c/button>\u003cbutton id=\"xBtn\" class=\"btn xpost\" type=\"button\">Xでポスト\u003c/button>\u003c/div>' +\n      '\u003ca class=\"unext\" href=\"https://video.unext.jp/brand/universal-plus\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"U-NEXTでUniversal+を観る（新しいタブで開きます）\">\u003cimg src=\"logo_white.png\" alt=\"Universal+\" onerror=\"this.style.display=\\'none\\'\">\u003cspan class=\"unext-txt\">\u003cb>U-NEXTでUniversal+を観る\u003c/b>\u003csmall>配信中の作品をチェック\u003c/small>\u003c/span>\u003cspan class=\"unext-arrow\" aria-hidden=\"true\">&rarr;\u003c/span>\u003c/a>' +\n      (isToday ? '\u003cp class=\"next-in\">次のパズルまで \u003cspan id=\"countdown\">--:--:--\u003c/span>\u003c/p>'\n               : '\u003cp class=\"next-in\">' + dayLabel(dayN) + 'クリア\u003c/p>') +\n    '\u003c/section>';\n  $('#shareBtn').addEventListener('click', share);\n  bindSocial('lineBtn', 'xBtn', resultShareText);\n  $('#againBtn').addEventListener('click', playAgain);\n  $('#archiveBtn').addEventListener('click', () => openArchive());\n  $('#homeBtn').addEventListener('click', goHome);\n  if(isToday) startCountdown();\n  setTimeout(() => softFocus($('#shareBtn')), 600);\n}\nfunction playAgain(){\n  busy = false; replay = true; done = false; sel = -1;\n  st = freshState();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('リプレイ中です。成績には反映されません。', true);\n  paint(); startTimer();\n  pinToTop($('#game'));\n}\n\n/* ---------- Share ---------- */\nfunction resultText(day, res){\n  return 'スタージャンプ #' + day + '\\n\\u{1F3AC} 7人のスターを' + fmtTimeJa(res.t) + 'でつなぎました\\n' +\n    (res.m ? 'ミス' + res.m + '回' : 'ノーミス') + '・' + (res.h ? 'ヒント' + res.h + '回' : 'ヒントなし') + '\\n' +\n    '\\u2B55'.repeat(6 - Math.min(6, res.h)) + '\\u{1F4A1}'.repeat(Math.min(6, res.h)) + (res.m ? ' ' + '\\u274C'.repeat(Math.min(6, res.m)) : '');\n}\nfunction sendShare(text, btnId, label){\n  var isWeb = /^https?:$/.test(UMG_HOST.protocol);\n  var payload = isWeb ? text + '\\n' + UMG_HOST.url : text;\n  function legacyCopy(){\n    try{\n      var ta = document.createElement('textarea');\n      ta.value = payload; ta.setAttribute('readonly','');\n      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';\n      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, payload.length);\n      var ok = document.execCommand('copy'); document.body.removeChild(ta);\n      if(ok){ flash(btnId, label); return; }\n    }catch(e){}\n    window.prompt('コピーしてシェアしてください：', payload);\n  }\n  function clip(){\n    if(navigator.clipboard && window.isSecureContext){\n      navigator.clipboard.writeText(payload).then(function(){ flash(btnId, label); }, legacyCopy);\n    }else legacyCopy();\n  }\n  if(navigator.share && isWeb){\n    navigator.share({ title:'スタージャンプ', text:text, url:UMG_HOST.url }).catch(function(err){ if(!err || err.name !== 'AbortError') clip(); });\n    return;\n  }\n  clip();\n}\nfunction share(){ const t = resultShareText(); if(t) sendShare(t, '#shareBtn', '結果をシェア'); }\nfunction resultShareText(){\n  const res = replay ? { t:st.elapsed, m:st.miss, h:st.hints } : store.results[iso]; if(!res) return '';\n  return resultText(dayN, res);\n}\nfunction shareLanding(){ sendShare(landingText(), '#landingShareBtn', 'シェア'); }\nfunction landingText(){\n  const res = store.results[todayISO], streak = displayStreak(), p = puzzleForDay(todayDay);\n  const text = res\n    ? resultText(todayDay, res) + (streak ? '\\n\\u{1F525} ' + streak + '日連続' : '')\n    : '\\u{1F3AC} スタージャンプ #' + todayDay + '\\n' + p.actors[0] + 'から' + p.actors[6] + 'まで、6本の映画でつなげられますか？' +\n      (streak ? '\\n\\u{1F525} ' + streak + '日連続プレイ中' : '');\n  return text;\n}\nfunction flash(btnId, label){\n  const b = $(btnId); if(!b) return;\n  b.textContent = 'コピーしました';\n  setTimeout(() => { const s = $(btnId); if(s) s.textContent = label; }, 2500);\n}\nfunction startCountdown(){\n  clearInterval(countdownId);\n  const tick = () => {\n    const now = new Date();\n    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();\n    const d = Math.max(0, next - now.getTime());\n    const el = $('#countdown');\n    if(el) el.textContent = [Math.floor(d / 3600000), Math.floor(d % 3600000 / 60000), Math.floor(d % 60000 / 1000)]\n      .map(n => String(n).padStart(2,'0')).join(':');\n  };\n  tick(); countdownId = setInterval(tick, 1000);\n}\n\n/* ---------- Screens ---------- */\nfunction show(id){\n  document.body.classList.toggle('on-landing', id === 'landing');\n  ['landing','game','archive'].forEach(s => {\n    const el = document.getElementById(s);\n    if(s === id){ el.classList.remove('hidden-left','hidden-right'); }\n    else if(!el.classList.contains('hidden-left') && !el.classList.contains('hidden-right')){\n      el.classList.add(s === 'landing' ? 'hidden-left' : 'hidden-right');\n    }\n  });\n  pinToTop(document.getElementById(id));\n}\nfunction openDay(n){\n  if(ptr) endGesture();\n  busy = false;\n  clearInterval(countdownId); clearInterval(timerId);\n  dayN = n; iso = isoForDay(n); isToday = (n === todayDay);\n  P = puzzleForDay(n);\n  sel = -1; replay = false;\n  $('#dayNo').textContent = dayLabel(n) + '・' + shortDate(dateForDay(n));\n  const flag = $('#archiveFlag');\n  flag.classList.toggle('on', !isToday);\n  flag.textContent = isToday ? '' : '\\u{1F5C3} 過去のパズル・' + longDate(dateForDay(n)) + '・連続日数には影響しません';\n  build();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('');\n  const res = store.results[iso];\n  if(res){\n    done = true;\n    st = freshState();\n    st.at = (res.at && res.at.length === GAPS) ? res.at.slice() : [0,1,2,3,4,5];\n    st.locked = st.locked.map(() => true);\n    st.elapsed = res.t; st.miss = res.m; st.hints = res.h;\n    $('#timer').textContent = fmtTime(res.t);\n    paint(); renderSolution();\n  }else{\n    done = false;\n    const saved = store.progress[iso];\n    st = (saved && saved.at && saved.at.length === GAPS) ? Object.assign(freshState(), saved, { wrong:[] }) : freshState();\n    paint(); startTimer();\n  }\n  show('game');\n  if(!res) setTimeout(() => softFocus(document.querySelector('.tile:not(:disabled)')), 500);\n}\nfunction buildArchive(){\n  const cards = []; let solved = 0, prog = 0, open = 0;\n  for(let n = todayDay; n >= 1; n--){\n    const d = isoForDay(n), p = puzzleForDay(n), res = store.results[d], pr = store.progress[d];\n    const isT = n === todayDay;\n    let cls, label;\n    if(res){ solved++; cls = 'solved'; label = '○ クリア・' + fmtTime(res.t); }\n    else if(pr){ prog++; cls = 'progress'; label = isT ? '今日・プレイ中' : 'プレイ中'; }\n    else if(isT){ open++; cls = 'today'; label = '今日のパズル'; }\n    else{ open++; cls = 'unplayed'; label = '未プレイ・今すぐ遊ぶ'; }\n    cards.push('\u003cbutton class=\"day-card' + (isT ? ' is-today' : '') + '\" type=\"button\" data-day=\"' + n + '\">' +\n      '\u003cspan class=\"dc-no\">' + dayLabel(n) + '・' + esc(shortDate(dateForDay(n))) + '\u003c/span>' +\n      '\u003cspan class=\"dc-title\">' + esc(p.actors[0]) + ' \\u2192 ' + esc(p.actors[6]) + '\u003c/span>' +\n      '\u003cspan class=\"dc-meta\">スター7人・映画6本\u003c/span>' +\n      '\u003cspan class=\"dc-status ' + cls + '\">' + label + '\u003c/span>\u003c/button>');\n  }\n  $('#archiveGrid').innerHTML = cards.join('');\n  $('#arcSolved').textContent = solved; $('#arcProgress').textContent = prog; $('#arcOpen').textContent = open;\n  document.querySelectorAll('.day-card').forEach(b => b.addEventListener('click', () => openDay(Number(b.dataset.day))));\n}\nfunction openArchive(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  buildArchive(); show('archive');\n  setTimeout(() => softFocus(document.querySelector('.day-card')), 500);\n}\nfunction goHome(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  paintLanding(); show('landing');\n  setTimeout(() => softFocus($('#startBtn')), 450);\n}\n\n/* ---------- Keyboard / TV remote ---------- */\ndocument.addEventListener('keydown', e => {\n  const gameOn = !$('#game').classList.contains('hidden-right') && !$('#game').classList.contains('hidden-left');\n  const ae = document.activeElement;\n  if(gameOn && !done){\n    if(/^[1-6]$/.test(e.key)){ if(sel >= 0) tapGap(Number(e.key) - 1); return; }\n    if(e.key === 'Escape' && sel >= 0){ sel = -1; setMsg(''); paint(); e.preventDefault(); return; }\n    if((e.key === 'Backspace' || e.key === 'Delete') && ae && ae.dataset && ae.dataset.gap !== undefined){\n      removeAt(Number(ae.dataset.gap)); e.preventDefault(); return;\n    }\n  }\n  const dirs = { ArrowUp:-1, ArrowLeft:-1, ArrowDown:1, ArrowRight:1 };\n  if(!(e.key in dirs)) return;\n  const list = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'))\n    .filter(b => b.offsetParent !== null);\n  if(!list.length) return;\n  e.preventDefault();\n  const i = list.indexOf(ae);\n  const next = i === -1 ? list[0] : list[(i + dirs[e.key] + list.length) % list.length];\n  try{ next.focus({ preventScroll:true }); }catch(err){ next.focus(); }\n  if(next.scrollIntoView) next.scrollIntoView({ block:'nearest', behavior:'smooth' });\n});\ndocument.addEventListener('visibilitychange', () => { if(document.hidden && st && !done) saveProgress(); });\nwindow.addEventListener('pagehide', () => { if(st && !done) saveProgress(); });\n\n/* ---------- Hub link ---------- */\nfunction toHub(){ try{ parent.postMessage({ umg:'home' }, '*'); }catch(e){} }\n$('#hubBtn').addEventListener('click', toHub);\ndocument.addEventListener('keydown', e => {\n  if(!isBackKey(e) || e.defaultPrevented) return;\n  const vis = id => { const el = document.getElementById(id); return !el.classList.contains('hidden-left') && !el.classList.contains('hidden-right'); };\n  const remoteBack = e.key !== 'Escape' && e.keyCode !== 27;\n  if(vis('landing')){ e.preventDefault(); toHub(); }\n  else if(vis('archive')){ e.preventDefault(); goHome(); }\n  else if(vis('game') && (remoteBack || done)){ e.preventDefault(); goHome(); }\n});\n\n/* ---------- Boot ---------- */\n$('#year').textContent = today.getFullYear();\n$('#startBtn').addEventListener('click', () => openDay(todayDay));\n$('#landingArchiveBtn').addEventListener('click', () => openArchive());\n$('#landingShareBtn').addEventListener('click', shareLanding);\nbindSocial('landingLineBtn', 'landingXBtn', landingText);\n$('#arcHomeBtn').addEventListener('click', goHome);\n$('#gameHomeBtn').addEventListener('click', goHome);\n$('#hintBtn').addEventListener('click', hint);\n$('#resetBtn').addEventListener('click', clearBoard);\ntry{ paintLanding(); }catch(err){ console.error(err); }\nsetTimeout(() => softFocus($('#startBtn')), 400);\n\n/* ===== LINE / X シェア ===== */\nfunction socialShare(kind, text){\n  if(!text) return;\n  var web = /^https?:$/.test(UMG_HOST.protocol);\n  var url = web ? UMG_HOST.url : '';\n  var href = kind === 'line'\n    ? 'https://line.me/R/share?text=' + encodeURIComponent(text + (url ? '\\n' + url : ''))\n    : 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : '');\n  /* 新しいタブで開く（ゲーム画面はそのまま残す） */\n  var a = document.createElement('a');\n  a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';\n  a.style.display = 'none'; document.body.appendChild(a); a.click();\n  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 0);\n}\nfunction bindSocial(line spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}\n  .actions-col{display:flex;flex-direction:column;align-items:center;gap:14px}\n  .landing-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}\n  .landing-row .btn{min-width:170px;min-width:min(170px,40vw)}\n\n  /* ---------- Buttons ---------- */\n  .btn{min-height:56px;padding:14px 26px;border:2px solid var(--line);border-radius:14px;color:#fff;\n    background:rgba(30,16,70,.8);font-weight:800;cursor:pointer;letter-spacing:.03em;text-decoration:none;\n    display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .15s,border-color .15s}\n  .btn:hover:not(:disabled){transform:scale(1.04);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .btn:focus-visible{transform:scale(1.04);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .btn:focus{transform:scale(1.04);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .btn.primary{background:linear-gradient(90deg,var(--gold),#ff9f3d);color:#2a1300;border-color:#ffe39a}\n  .btn.pink{background:var(--pink);border-color:#ff9cc6}\n  .btn.ghost{min-height:48px;padding:10px 22px;font-size:15px;font-size:clamp(13px,1.6vw,15px);background:rgba(255,79,154,.18);border-color:rgba(255,79,154,.6)}\n  .btn-lg{font-size:22px;font-size:clamp(17px,2.2vw,22px);min-width:320px;min-width:min(320px,80vw);text-transform:uppercase}\n  .btn:disabled{opacity:.45;cursor:default;transform:none}\n\n  /* ---------- Game ---------- */\n  #game .wrap{display:flex;flex-direction:column;gap:22px;gap:clamp(12px,2.2vh,22px)}\n  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}\n  .round-name{font-weight:800;font-size:26px;font-size:clamp(16px,2.4vw,26px);color:var(--gold);text-align:left}\n  .round-sub{font-size:13px;font-size:clamp(11px,1.4vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);text-align:left;font-weight:800}\n  .score{font-weight:800;font-size:30px;font-size:clamp(18px,2.6vw,30px);font-variant-numeric:tabular-nums}\n  .score small{display:block;font-size:.45em;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}\n  .dots{display:flex;gap:10px;gap:clamp(5px,1vw,10px);justify-content:center}\n  .dot{width:26px;width:clamp(14px,2.4vw,26px);height:26px;height:clamp(14px,2.4vw,26px);border-radius:50%;\n    background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);transition:background .3s,transform .3s}\n  .dot.now{border-color:var(--gold);transform:scale(1.2)}\n  .dot.ok{background:var(--green);border-color:var(--green)}\n  .dot.bad{background:var(--red);border-color:var(--red)}\n  .timebar{height:14px;height:clamp(8px,1.2vh,14px);border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}\n  .timebar i{display:block;height:100%;width:100%;border-radius:99px;\n    background:linear-gradient(90deg,var(--green),var(--gold),var(--pink));transform-origin:left}\n  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:24px;\n    padding:40px;\n    padding:clamp(18px,3.4vw,40px);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .4s}\n  .qnum{font-size:14px;font-size:clamp(11px,1.4vw,14px);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:10px}\n  .qtext{font-size:40px;font-size:clamp(20px,3.3vw,40px);font-weight:800;line-height:1.25;margin:0}\n  .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;gap:clamp(10px,1.6vw,18px)}\n  .opt{position:relative;text-align:left;min-height:110px;min-height:clamp(64px,10vh,110px);padding:14px 18px 14px 78px;padding:14px 18px 14px clamp(58px,7vw,78px);\n    border:3px solid var(--line);border-radius:18px;background:rgba(30,16,70,.85);color:#fff;cursor:pointer;\n    font-weight:700;font-size:26px;font-size:clamp(16px,2.2vw,26px);line-height:1.25;\n    transition:transform .15s,background .15s,border-color .15s;opacity:0;animation:pop .35s forwards}\n  .opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}\n  .opt .key{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:48px;width:clamp(32px,4.6vw,48px);height:48px;height:clamp(32px,4.6vw,48px);\n    border-radius:12px;display:grid;place-items:center;font-weight:800;color:#2a1300;font-size:22px;font-size:clamp(15px,2vw,22px)}\n  .opt:nth-child(1) .key{background:var(--gold)}.opt:nth-child(2) .key{background:var(--pink);color:#fff}\n  .opt:nth-child(3) .key{background:var(--cyan)}.opt:nth-child(4) .key{background:#9b7bff;color:#fff}\n  .opt:hover:not(:disabled){transform:scale(1.03);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .opt:focus-visible{transform:scale(1.03);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .kbd .opt:focus{transform:scale(1.03);border-color:var(--gold);background:rgba(60,30,120,.9)}\n  .opt:disabled{cursor:default}\n  .opt.right{background:rgba(34,201,122,.35);border-color:var(--green);animation:none;opacity:1}\n  .opt.wrong{background:rgba(255,90,90,.3);border-color:var(--red);animation:shake .4s;opacity:1}\n  .opt.dim{opacity:.45;animation:none}\n  .feedback{min-height:1.6em;font-weight:800;font-size:30px;font-size:clamp(18px,2.6vw,30px)}\n  .feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}\n  .nextrow{display:flex;justify-content:center;min-height:60px}\n  .replay-flag{display:none;padding:10px 16px;border-radius:12px;background:rgba(255,79,154,.14);border:1px solid rgba(255,79,154,.5);\n    font-weight:700;font-size:15px;font-size:clamp(12px,1.6vw,15px);color:#ffc0dc}\n  .replay-flag.on{display:block}\n  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}\n  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}\n\n  /* ---------- Results ---------- */\n  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:44px;padding:clamp(20px,4vw,44px);animation:pop .5s}\n  .big-score{font-size:140px;font-size:clamp(56px,12vw,140px);font-weight:800;line-height:1;\n    background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .stars{font-size:64px;font-size:clamp(30px,6vw,64px);letter-spacing:.1em;margin:6px 0}\n  .verdict{font-size:34px;font-size:clamp(20px,3vw,34px);font-weight:800;margin:6px 0}\n  .points{color:var(--muted);font-size:19px;font-size:clamp(14px,1.8vw,19px);margin-bottom:18px}\n  .review{text-align:left;display:grid;gap:8px;margin:18px 0}\n  .review div{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:16px;font-size:clamp(13px,1.6vw,16px);line-height:1.4}\n  .review b{color:var(--gold)}\n  .review .x{color:var(--red);font-weight:800}.review .t{color:var(--green);font-weight:800}\n  .banner{margin:16px 0 0;padding:14px;border-radius:14px;background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.4);font-weight:800;font-size:20px;font-size:clamp(15px,2vw,20px)}\n  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;gap:clamp(12px,2vw,20px);margin-top:22px}\n  .next-in{color:var(--muted);margin-top:22px;letter-spacing:.16em;text-transform:uppercase;font-size:13px;font-size:clamp(11px,1.4vw,13px);font-variant-numeric:tabular-nums}\n  .archive-flag{display:none;padding:10px 16px;border-radius:12px;background:rgba(51,214,255,.12);border:1px solid rgba(51,214,255,.4);\n    font-weight:700;font-size:15px;font-size:clamp(12px,1.6vw,15px);color:#bdf2ff}\n  .archive-flag.on{display:block}\n\n  /* ---------- Archive ---------- */\n  .archive-head h2{font-size:48px;font-size:clamp(26px,4vw,48px);margin:0 0 6px;font-weight:800;text-transform:uppercase}\n  .archive-head p{color:var(--muted);margin:0 0 18px}\n  .archive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;text-align:left}\n  .rcard{position:relative;padding:16px 16px 50px;border:2px solid var(--line);border-radius:18px;background:var(--panel);\n    color:#fff;cursor:pointer;min-height:120px;text-align:left;transition:transform .15s,border-color .15s}\n  .rcard:hover{transform:scale(1.03);border-color:var(--gold)}\n  .rcard:focus-visible{transform:scale(1.03);border-color:var(--gold)}\n  .kbd .rcard:focus{transform:scale(1.03);border-color:var(--gold)}\n  .rcard .no{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:800}\n  .rcard .tt{display:block;font-weight:800;font-size:20px;font-size:clamp(16px,1.9vw,20px);margin-top:8px;line-height:1.2}\n  .rcard .st{position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;\n    padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line)}\n  .rcard .st.today{background:var(--gold);color:#2a1300}\n  .rcard .st.done{background:rgba(34,201,122,.25);color:#9ff5cb;border-color:var(--green)}\n  .rcard .st.part{background:rgba(255,79,154,.25);color:#ffc0dc;border-color:var(--pink)}\n  .rcard.is-today{border-color:rgba(255,200,61,.7)}\n  .archive-foot{margin-top:20px;display:flex;justify-content:center}\n\n  #copyright{position:fixed;left:0;right:0;bottom:0;z-index:6;text-align:center;font-size:13px;font-size:clamp(10px,1.3vw,13px);\n    color:rgba(255,255,255,.7);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none;text-shadow:0 1px 4px #000}\n  .confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:50;pointer-events:none;animation:fall linear forwards}\n  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}\n\n  @media (max-width:700px){\n    .options{grid-template-columns:1fr}\n    .stats{grid-template-columns:repeat(2,1fr)}\n    .actions{grid-template-columns:1fr}\n    .archive-grid{grid-template-columns:1fr}\n  }\n  @media (max-height:500px) and (orientation:landscape){\n    .logo{max-height:12vh}\n    .opt{min-height:52px}\n    .brand .l2{font-size:60px;font-size:clamp(30px,6vw,60px)}\n    .datestamp{margin-top:10px}\n  }\n  @media (min-width:1600px){\n    .screen{padding:5vh 6vw 7vh}\n    .wrap{width:100%;max-width:1500px;width:min(1500px,100%)}\n    .btn{min-height:72px;font-size:22px}\n    .opt{min-height:14vh}\n  }\n  @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}\n\n  body:not(.on-landing) #copyright{display:none}\n  /* ---- Smart TVs: no share sheet / clipboard on TV browsers, lighter animation ---- */\n  .tv #landingShareBtn,.tv #shareBtn{display:none!important}\n  .tv .spot,.tv .confetti{animation:none!important}\n  .kbd button:focus{outline:4px solid var(--gold);outline-offset:4px}\n\n  /* ---- room for the hub's music button in the top-right corner ---- */\n  .topbar,.top{padding-right:56px}\n  @media(min-width:1600px){ .topbar,.top{padding-right:76px} }\n\n  /* ===== 日本語ローカライズ: タイポグラフィ ===== */\n  html,body,button,input{font-family:\"Noto Sans JP\",\"Hiragino Kaku Gothic ProN\",\"Hiragino Sans\",\"BIZ UDPGothic\",\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif}\n  body{line-height:1.7;line-break:strict;overflow-wrap:anywhere;word-break:normal}\n  *,*::before,*::after{font-style:normal!important;text-transform:none!important}\n  p,li,.tagline,.tip,.msg,.chiprule,.gdesc,.qtext,.review div,.cast li,.chain li,.legend li,.sub,.banner,.streak-banner,\n  .archive-head p,.dc-films,.dc-meta,.movie-meta,.feedback,.points,.verdict,.archive-flag,.replay-flag,.theme-pill,.progress{line-height:1.7}\n  /* 欧文向けの広い字間は和文では読みにくいので詰める */\n  .datestamp,.day-no,.dc-no,.stat span,.archive-stats span,.loading-text,.next-in,.panel h3,.solution h4,.chip,.dc-status,\n  .brand .of,.brand .l1,.brand .l3,.qnum,.round-sub,.meter,.wd,.rcard .no,.rcard .st,.score small,.timer,.gbtn,.slot .gn{letter-spacing:.06em!important}\n  .brand,.brand .l2,.title,.gname,.btn,.actor,.verdict-line,.archive-head h2{letter-spacing:.02em!important}\n  .brand .of{font-size:.34em}\n  /* LINE / X シェア */\n  .social{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px}\n  .social .btn{min-width:150px}\n  .btn.line{background:#06C755;border-color:#06C755;color:#fff}\n  .btn.xpost{background:#111;border-color:#555;color:#fff}\n  .btn.line:hover:not(:disabled),.btn.line:focus-visible{background:#05b14c;border-color:#fff}\n  .btn.xpost:hover:not(:disabled),.btn.xpost:focus-visible{background:#333;border-color:#fff}\n  .tv .social,.tv .line,.tv .xpost{display:none!important}\n  /* U-NEXT で Universal+ を観る */\n  .unext{display:flex;align-items:center;gap:16px;margin:22px auto 0;max-width:560px;padding:14px 20px;border-radius:16px;\n    text-decoration:none;color:#fff;background:linear-gradient(90deg,#0b1a2e,#123a6b);border:2px solid #4aa3ff;\n    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,background .15s}\n  .unext:hover,.unext:focus-visible{transform:scale(1.03);border-color:var(--gold);background:linear-gradient(90deg,#10264a,#1a4f92)}\n  .kbd .unext:focus{transform:scale(1.03);border-color:var(--gold);outline:4px solid var(--gold);outline-offset:4px}\n  .unext img{flex:0 0 auto;height:44px;width:auto;max-width:120px;object-fit:contain}\n  .unext-txt{flex:1 1 auto;display:flex;flex-direction:column;text-align:left;line-height:1.5}\n  .unext-txt b{font-size:18px;font-size:clamp(15px,1.9vw,18px);font-weight:800}\n  .unext-txt small{font-size:13px;color:#cfe3ff}\n  .unext-arrow{flex:0 0 auto;font-size:22px;font-weight:800;color:var(--gold)}\n  @media(max-width:480px){ .unext{gap:10px;padding:12px 14px} .unext img{height:34px;max-width:90px} }\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"on-landing\">\n\u003c!-- ============ LANDING ============ -->\n\u003csection id=\"landing\" class=\"screen\">\n  \u003cmain class=\"wrap\">\n    \u003cimg class=\"logo\" src=\"logo_white.png\" alt=\"\" onerror=\"this.style.display='none'\">\n    \u003ch1 class=\"brand\">\u003cspan class=\"l1\">Universal+\u003c/span>\u003cspan class=\"l2\">シネマニアック\u003c/span>\u003cspan class=\"l3\">毎日の映画クイズ\u003c/span>\u003c/h1>\n    \u003cp class=\"datestamp\" id=\"landingDate\">\u003c/p>\n    \u003cdiv class=\"theme-pill\" id=\"landingTheme\">\u003c/div>\n    \u003cp class=\"tagline\" id=\"landingTag\">1日10問の映画クイズ。毎日新しいテーマをお届けします。\u003c/p>\n    \u003cdiv class=\"stats\">\n      \u003cdiv class=\"stat\">\u003cb id=\"statStreak\">0\u003c/b>\u003cspan>連続日数\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statBest\">0\u003c/b>\u003cspan>最高記録\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statPerfect\">0\u003c/b>\u003cspan>全問正解\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"statAvg\">0\u003c/b>\u003cspan>平均正解数\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"actions-col\">\n      \u003cbutton id=\"startBtn\" class=\"btn primary btn-lg\" type=\"button\">今日のクイズに挑戦\u003c/button>\n      \u003cdiv class=\"landing-row\">\n        \u003cbutton id=\"landingArchiveBtn\" class=\"btn ghost\" type=\"button\">過去のクイズ\u003c/button>\n        \u003cbutton id=\"landingShareBtn\" class=\"btn ghost\" type=\"button\">シェア\u003c/button>\n        \u003cbutton id=\"landingLineBtn\" class=\"btn ghost line\" type=\"button\">LINE\u003c/button>\n        \u003cbutton id=\"landingXBtn\" class=\"btn ghost xpost\" type=\"button\">X\u003c/button>\n        \u003cbutton id=\"hubBtn\" class=\"btn ghost\" type=\"button\">ゲーム一覧\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ GAME ============ -->\n\u003csection id=\"game\" class=\"screen hidden-right\">\n  \u003cmain class=\"wrap\">\n    \u003cdiv class=\"archive-flag\" id=\"archiveFlag\">\u003c/div>\n    \u003cdiv class=\"replay-flag\" id=\"replayFlag\">リプレイ中・成績には反映されません\u003c/div>\n    \u003cdiv class=\"topbar\">\n      \u003cdiv>\u003cdiv class=\"round-sub\" id=\"roundSub\">\u003c/div>\u003cdiv class=\"round-name\" id=\"roundName\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"score\" id=\"scoreBox\">0\u003csmall>ポイント\u003c/small>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"dots\" id=\"dots\">\u003c/div>\n    \u003cdiv class=\"timebar\">\u003ci id=\"timeFill\">\u003c/i>\u003c/div>\n    \u003cdiv id=\"playArea\">\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003c!-- ============ ARCHIVE ============ -->\n\u003csection id=\"archive\" class=\"screen hidden-right\">\n  \u003cmain class=\"wrap\">\n    \u003cdiv class=\"archive-head\">\n      \u003ch2>過去のクイズ\u003c/h2>\n      \u003cp>見逃した回もプレイできます。過去の回は連続日数に影響しません。\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"archive-grid\" id=\"archiveGrid\">\u003c/div>\n    \u003cdiv class=\"archive-foot\">\u003cbutton id=\"arcHomeBtn\" class=\"btn\" type=\"button\">ホームへ戻る\u003c/button>\u003c/div>\n  \u003c/main>\n\u003c/section>\n\n\u003cfooter id=\"copyright\">&copy; \u003cspan id=\"year\">\u003c/span> NBCUniversal・毎日新しいクイズをお届けします\u003c/footer>\n\n\u003cscript>\n/* ---------- Compatibility: older smart-TV browsers (Chrome 53+) ---------- */\nif(!String.prototype.padStart){\n  String.prototype.padStart = function(n, s){\n    var t = String(this); if(t.length >= n) return t;\n    s = s === undefined ? ' ' : String(s); if(!s) return t;\n    var p = ''; while(p.length \u003c n - t.length) p += s;\n    return p.slice(0, n - t.length) + t;\n  };\n}\nif(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;\n\n/* ===== 日本語ローカライズ: 日付・数値（Intl ja-JP） ===== */\nvar JA_LONG = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });\nvar JA_SHORT = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'numeric', day:'numeric' });\nvar JA_NUM = new Intl.NumberFormat('ja-JP');\nvar JA_COMPACT = (function(){ try{ return new Intl.NumberFormat('ja-JP', { notation:'compact
