ws.length){\n    setMsg(wordsAt(c).length ? 'その名前はヒントで配置済みです。' : '出演者リストからスターを選ぶか、マス目にドラッグしてください。');\n    return;\n  }\n  sel = ws[0]; st.at[sel] = -1;                  // pick the name back up\n  afterMove();\n}\nfunction afterMove(){\n  saveProgress();\n  const ev = paint();\n  const all = st.at.every(s => s >= 0);\n  if(ev.conf.size) setMsg('おしい！交差するカナが合っていません（赤く表示）。');\n  else if(all) win();\n  else if(sel >= 0) setMsg(P.words[sel].name + 'を入れる' + wordLen(sel) + 'マスの枠をタップしてください。');\n  else setMsg('');\n}\nfunction hint(){\n  if(done) return;\n  const w = P.words.findIndex((_, k) => st.at[k] !== P.sol[k] && !isLocked(k));\n  if(w \u003c 0) return;\n  const s = P.sol[w], occ = occupant(s);\n  if(occ >= 0) st.at[occ] = -1;\n  st.at[w] = s;\n  if(!isLocked(w)) st.locked.push(w);\n  st.hints++;\n  if(sel === w) sel = -1;\n  afterMove();\n  if(!done) setMsg('ヒント：' + P.words[w].name + 'は' + (P.slots[s].dir ? 'タテ' : 'ヨコ') + 'の' + P.slots[s].num + 'です。', true);\n}\nfunction clearBoard(){\n  if(done) return;\n  st.at = st.at.map((s, w) => isLocked(w) ? s : -1);\n  sel = -1;\n  afterMove();\n}\n\n/* ---------- Drag & drop (pointer events: mouse, touch, pen) ----------\n   A press that never moves past the threshold is left to the click handler,\n   so taps work exactly as before. */\nconst DRAG_PX = 6;\nlet ptr = null, suppressUntil = 0;\nconst clickSuppressed = () => Date.now() \u003c suppressUntil;\nfunction cellAt(x, y){\n  const el = document.elementFromPoint(x, y);\n  const cell = el && el.closest ? el.closest('.cell') : null;\n  return cell && $('#board').contains(cell) ? Number(cell.dataset.cell) : -1;\n}\nfunction starPointerDown(e, w){\n  if(done || e.button > 0 || isLocked(w)) return;\n  startGesture(e, { word:w, fromGrid:false });\n}\nfunction cellPointerDown(e, c){\n  if(done || e.button > 0 || sel >= 0) return;   // with a name selected, a press is a tap\n  const ws = wordsAt(c).filter(w => !isLocked(w));\n  if(!ws.length) return;\n  startGesture(e, { word:ws[0], fromGrid:true });\n}\nfunction startGesture(e, g){\n  g.id = e.pointerId; g.x0 = e.clientX; g.y0 = e.clientY; g.moved = false; g.ghost = null; g.over = -1;\n  ptr = g;\n  window.addEventListener('pointermove', onPtrMove, { passive:false });\n  window.addEventListener('pointerup', onPtrUp);\n  window.addEventListener('pointercancel', onPtrCancel);\n}\nfunction clearDropMarks(){\n  document.querySelectorAll('.cell.drop-target,.cell.drop-bad').forEach(x => x.classList.remove('drop-target','drop-bad'));\n}\nfunction onPtrMove(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  if(!ptr.moved && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) \u003c DRAG_PX) return;\n  e.preventDefault();\n  const w = ptr.word;\n  if(!ptr.moved){\n    ptr.moved = true;\n    sel = -1; paint();\n    const g = document.createElement('div');\n    g.className = 'drag-ghost';\n    g.textContent = P.words[w].w;\n    document.body.appendChild(g);\n    ptr.ghost = g;\n    document.body.classList.add('is-dragging');\n    const src = document.querySelector('.star[data-w=\"' + w + '\"]');\n    if(src) src.classList.add('dragging');\n    if(st.at[w] >= 0) P.slots[st.at[w]].cells.forEach(c => {\n      const el = document.querySelector('.cell[data-cell=\"' + c + '\"]'); if(el) el.classList.add('lifted');\n    });\n    setMsg(P.words[w].name + 'を' + wordLen(w) + 'マスの枠に置いてください' + (st.at[w] >= 0 ? '（盤面の外で取り消し）。' : '。'));\n  }\n  const gw = ptr.ghost.offsetWidth, gh = ptr.ghost.offsetHeight;\n  ptr.ghost.style.transform = 'translate3d(' + (e.clientX - gw / 2) + 'px,' + (e.clientY - gh - 18) + 'px,0)';\n  const c = cellAt(e.clientX, e.clientY);\n  if(c === ptr.over) return;\n  ptr.over = c;\n  clearDropMarks();\n  if(c \u003c 0) return;\n  const s = slotFor(c, w);\n  if(s \u003c 0){ document.querySelector('.cell[data-cell=\"' + c + '\"]').classList.add('drop-bad'); return; }\n  const occ = occupant(s), blocked = occ >= 0 && occ !== w && isLocked(occ);\n  P.slots[s].cells.forEach(x => document.querySelector('.cell[data-cell=\"' + x + '\"]').classList.add(blocked ? 'drop-bad' : 'drop-target'));\n}\nfunction endGesture(){\n  window.removeEventListener('pointermove', onPtrMove);\n  window.removeEventListener('pointerup', onPtrUp);\n  window.removeEventListener('pointercancel', onPtrCancel);\n  if(ptr && ptr.ghost) ptr.ghost.remove();\n  document.body.classList.remove('is-dragging');\n  clearDropMarks();\n  document.querySelectorAll('.star.dragging').forEach(x => x.classList.remove('dragging'));\n  document.querySelectorAll('.cell.lifted').forEach(x => x.classList.remove('lifted'));\n  ptr = null;\n}\nfunction onPtrCancel(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  endGesture(); paint();\n}\nfunction onPtrUp(e){\n  if(!ptr || e.pointerId !== ptr.id) return;\n  const g = ptr;\n  if(!g.moved){ endGesture(); return; }          // plain tap: click handler runs\n  suppressUntil = Date.now() + 400;\n  const c = cellAt(e.clientX, e.clientY);\n  endGesture();\n  const w = g.word;\n  if(c \u003c 0){\n    if(st.at[w] >= 0){ st.at[w] = -1; afterMove(); }\n    else { setMsg(''); paint(); }\n    return;\n  }\n  const s = slotFor(c, w);\n  if(s \u003c 0){ paint(); noFitMsg(w); return; }\n  if(!placeWord(w, s)){ paint(); return; }\n  afterMove();\n}\n\n/* ---------- Progress / results ---------- */\nconst freshState = () => ({ at:P.words.map(() => -1), locked:[], hints:0, elapsed:0 });\nfunction saveProgress(){\n  if(replay || store.results[iso]) return;\n  store.progress[iso] = st; saveStore();\n}\nfunction recordWin(){\n  if(store.results[iso]) return;\n  if(isToday){\n    const y = toISO(new Date(parseISO(iso) - MS_DAY));\n    store.streak = (store.lastPlayedISO === y && store.streak > 0) ? store.streak + 1 : 1;\n    store.best = Math.max(store.best, store.streak);\n    store.lastPlayedISO = iso;\n  }\n  store.solved++;\n  store.results[iso] = { t:st.elapsed, h:st.hints, at:st.at.slice(), archive:!isToday };\n  delete store.progress[iso];\n  saveStore();\n}\nfunction startTimer(){\n  clearInterval(timerId);\n  $('#timer').textContent = fmtTime(st.elapsed);\n  timerId = setInterval(() => {\n    if(document.hidden) return;\n    st.elapsed++;\n    $('#timer').textContent = fmtTime(st.elapsed);\n    if(st.elapsed % 5 === 0) saveProgress();\n  }, 1000);\n}\nfunction win(){\n  done = true; sel = -1;\n  clearInterval(timerId);\n  if(!replay) recordWin();\n  setMsg('');\n  paint();\n  renderSolution();\n  confetti();\n  scrollToEl($('#game'), $('#solutionSlot'));\n}\nfunction confetti(){\n  const cols = ['#ffc83d','#ff4f9a','#33d6ff','#22c97a','#9b7bff'];\n  for(let i = 0; i \u003c 80; i++){\n    const c = document.createElement('i');\n    c.className = 'confetti';\n    c.style.left = Math.random() * 100 + 'vw';\n    c.style.background = cols[i % cols.length];\n    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';\n    c.style.animationDelay = Math.random() * .8 + 's';\n    document.body.appendChild(c);\n    setTimeout(() => c.remove(), 6000);\n  }\n}\nfunction renderSolution(){\n  const res = store.results[iso];\n  const time = replay ? st.elapsed : res.t, hints = replay ? st.hints : res.h;\n  const list = P.words.map((w, i) => ({ w, s:P.slots[st.at[i] >= 0 ? st.at[i] : P.sol[i]] }))\n    .sort((a, b) => a.s.num - b.s.num || a.s.dir - b.s.dir)\n    .map(x => '\u003cli>\u003cb>' + (x.s.dir ? 'タテ' : 'ヨコ') + x.s.num + '\u003c/b>' + esc(x.w.name) + '\u003c/li>').join('');\n  const banner = replay ? 'リプレイ・最初の結果はそのまま残ります'\n    : isToday ? '\\u{1F525} ' + displayStreak() + '日連続・クリア ' + store.solved + '回'\n    : '\\u{1F5C3} 過去のパズル・連続日数はそのまま・クリア ' + store.solved + '回';\n  $('#solutionSlot').innerHTML =\n    '\u003csection class=\"solution\">' +\n      '\u003cp class=\"verdict-line\">完成です！おみごと\u003c/p>' +\n      '\u003cp class=\"sub\">『' + esc(P.movie.t) + '』（' + P.movie.y + '年）・' + fmtTimeJa(time) + 'でクリア・' +\n        (hints ? 'ヒント' + hints + '回' : 'ヒントなし') + '\u003c/p>' +\n      '\u003ch4>出演\u003c/h4>\u003cul class=\"cast\">' + list + '\u003c/ul>' +\n      '\u003cdiv class=\"streak-banner\">' + banner + '\u003c/div>' +\n      '\u003cdiv class=\"actions\">' +\n        '\u003cbutton id=\"shareBtn\" class=\"btn\" type=\"button\">結果をシェア\u003c/button>' +\n        '\u003cbutton id=\"againBtn\" class=\"btn\" type=\"button\">もう一度遊ぶ\u003c/button>' +\n        '\u003cbutton id=\"archiveBtn\" class=\"btn\" type=\"button\">過去のパズル\u003c/button>' +\n        '\u003cbutton id=\"homeBtn\" class=\"btn primary\" type=\"button\">ホームへ戻る\u003c/button>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"social\">\u003cbutton id=\"lineBtn\" class=\"btn line\" type=\"button\">LINEで送る\u003c/button>\u003cbutton id=\"xBtn\" class=\"btn xpost\" type=\"button\">Xでポスト\u003c/button>\u003c/div>' +\n      '\u003ca class=\"unext\" href=\"https://video.unext.jp/brand/universal-plus\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"U-NEXTでUniversal+を観る（新しいタブで開きます）\">\u003cimg src=\"logo_white.png\" alt=\"Universal+\" onerror=\"this.style.display=\\'none\\'\">\u003cspan class=\"unext-txt\">\u003cb>U-NEXTでUniversal+を観る\u003c/b>\u003csmall>配信中の作品をチェック\u003c/small>\u003c/span>\u003cspan class=\"unext-arrow\" aria-hidden=\"true\">&rarr;\u003c/span>\u003c/a>' +\n      (isToday ? '\u003cp class=\"next-in\">次の映画まで \u003cspan id=\"countdown\">--:--:--\u003c/span>\u003c/p>'\n               : '\u003cp class=\"next-in\">' + dayLabel(dayN) + 'クリア\u003c/p>') +\n    '\u003c/section>';\n  $('#shareBtn').addEventListener('click', share);\n  bindSocial('lineBtn', 'xBtn', resultShareText);\n  $('#againBtn').addEventListener('click', playAgain);\n  $('#archiveBtn').addEventListener('click', () => openArchive());\n  $('#homeBtn').addEventListener('click', goHome);\n  if(isToday) startCountdown();\n}\nfunction playAgain(){\n  replay = true; done = false; sel = -1;\n  st = freshState();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('リプレイ中です。成績には反映されません。', true);\n  paint(); startTimer();\n  pinToTop($('#game'));\n}\n\n/* ---------- Share (secure-context aware, with fallbacks) ---------- */\nfunction resultText(day, p, res){\n  let grid = '';\n  for(let r = 0; r \u003c p.rows; r++){\n    for(let c = 0; c \u003c p.cols; c++) grid += p.cellSlots[r * p.cols + c].length ? '\\u{1F7E8}' : '\\u2B1B';\n    grid += '\\n';\n  }\n  return 'スタークロス #' + day + '\\n\\u{1F3AC} スター' + p.words.length + '人を' + fmtTimeJa(res.t) + 'でクロス・' +\n    (res.h ? 'ヒント' + res.h + '回' : 'ヒントなし') + '\\n' + grid.trim();\n}\nfunction sendShare(text, btnId, label){\n  var isWeb = /^https?:$/.test(UMG_HOST.protocol);\n  var payload = isWeb ? text + '\\n' + UMG_HOST.url : text;\n  function legacyCopy(){\n    try{\n      var ta = document.createElement('textarea');\n      ta.value = payload; ta.setAttribute('readonly','');\n      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';\n      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, payload.length);\n      var ok = document.execCommand('copy'); document.body.removeChild(ta);\n      if(ok){ flash(btnId, label); return; }\n    }catch(e){}\n    window.prompt('コピーしてシェアしてください：', payload);\n  }\n  function clip(){\n    if(navigator.clipboard && window.isSecureContext){\n      navigator.clipboard.writeText(payload).then(function(){ flash(btnId, label); }, legacyCopy);\n    }else legacyCopy();\n  }\n  if(navigator.share && isWeb){\n    navigator.share({ title:'スタークロス', text:text, url:UMG_HOST.url }).catch(function(err){ if(!err || err.name !== 'AbortError') clip(); });\n    return;\n  }\n  clip();\n}\nfunction share(){ const t = resultShareText(); if(t) sendShare(t, '#shareBtn', '結果をシェア'); }\nfunction resultShareText(){\n  const res = store.results[iso]; if(!res) return '';\n  return resultText(dayN, P, res);\n}\nfunction shareLanding(){ sendShare(landingText(), '#landingShareBtn', 'シェア'); }\nfunction landingText(){\n  const res = store.results[todayISO], streak = displayStreak();\n  const text = res\n    ? resultText(todayDay, puzzleForDay(todayDay), res) + (streak ? '\\n\\u{1F525} ' + streak + '日連続' : '')\n    : '\\u{1F3AC} スタークロス #' + todayDay + '\\n今日の映画のスターたち、全員マス目に入れられますか？' +\n      (streak ? '\\n\\u{1F525} ' + streak + '日連続プレイ中' : '');\n  return text;\n}\nfunction flash(btnId, label){\n  const b = $(btnId); if(!b) return;\n  b.textContent = 'コピーしました';\n  setTimeout(() => { const s = $(btnId); if(s) s.textContent = label; }, 2500);\n}\n\nfunction startCountdown(){\n  clearInterval(countdownId);\n  const tick = () => {\n    const now = new Date();\n    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();\n    const d = Math.max(0, next - now.getTime());\n    const el = $('#countdown');\n    if(el) el.textContent = [Math.floor(d / 3600000), Math.floor(d % 3600000 / 60000), Math.floor(d % 60000 / 1000)]\n      .map(n => String(n).padStart(2,'0')).join(':');\n  };\n  tick(); countdownId = setInterval(tick, 1000);\n}\n\n/* ---------- Screens ---------- */\nfunction show(id){\n  document.body.classList.toggle('on-landing', id === 'landing');   // footer only on the landing page\n  ['landing','game','archive'].forEach(s => {\n    const el = document.getElementById(s);\n    if(s === id){ el.classList.remove('hidden-left','hidden-right'); }\n    else if(!el.classList.contains('hidden-left') && !el.classList.contains('hidden-right')){\n      el.classList.add(s === 'landing' ? 'hidden-left' : 'hidden-right');\n    }\n  });\n  pinToTop(document.getElementById(id));\n}\nfunction openDay(n){\n  if(ptr) endGesture();\n  clearInterval(countdownId); clearInterval(timerId);\n  dayN = n; iso = isoForDay(n); isToday = (n === todayDay);\n  P = puzzleForDay(n);\n  sel = -1; replay = false;\n  $('#dayNo').textContent = dayLabel(n) + '・' + shortDate(dateForDay(n));\n  const flag = $('#archiveFlag');\n  flag.classList.toggle('on', !isToday);\n  flag.textContent = isToday ? '' : '\\u{1F5C3} 過去のパズル・' + longDate(dateForDay(n)) + '・連続日数には影響しません';\n  buildBoard();\n  $('#solutionSlot').innerHTML = '';\n  setMsg('');\n  const res = store.results[iso];\n  if(res){\n    done = true;\n    st = freshState();\n    st.at = (res.at && res.at.length === P.words.length) ? res.at.slice() : P.sol.slice();\n    st.elapsed = res.t; st.hints = res.h;\n    $('#timer').textContent = fmtTime(res.t);\n    paint(); renderSolution();\n  }else{\n    done = false;\n    const saved = store.progress[iso];\n    st = (saved && saved.at && saved.at.length === P.words.length) ? Object.assign(freshState(), saved) : freshState();\n    paint(); startTimer();\n  }\n  show('game');\n  setTimeout(() => softFocus(document.querySelector('.star:not(:disabled)')), 500);\n}\nfunction buildArchive(){\n  const cards = []; let solved = 0, prog = 0, open = 0;\n  for(let n = todayDay; n >= 1; n--){\n    const d = isoForDay(n), mv = MOVIES[movieForDay(n)], res = store.results[d], pr = store.progress[d];\n    const isT = n === todayDay;\n    let cls, label;\n    if(res){ solved++; cls = 'solved'; label = '○ クリア・' + fmtTime(res.t); }\n    else if(pr){ prog++; cls = 'progress'; label = isT ? '今日・プレイ中' : 'プレイ中'; }\n    else if(isT){ open++; cls = 'today'; label = '今日の映画'; }\n    else{ open++; cls = 'unplayed'; label = '未プレイ・今すぐ遊ぶ'; }\n    cards.push('\u003cbutton class=\"day-card' + (isT ? ' is-today' : '') + '\" type=\"button\" data-day=\"' + n + '\">' +\n      '\u003cspan class=\"dc-no\">' + dayLabel(n) + '・' + esc(shortDate(dateForDay(n))) + '\u003c/span>' +\n      '\u003cspan class=\"dc-title\">' + esc(mv[0]) + '\u003c/span>' +\n      '\u003cspan class=\"dc-meta\">' + mv[1] + '年・' + esc(mv[2]) + '\u003c/span>' +\n      '\u003cspan class=\"dc-status ' + cls + '\">' + label + '\u003c/span>\u003c/button>');\n  }\n  $('#archiveGrid').innerHTML = cards.join('');\n  $('#arcSolved').textContent = solved; $('#arcProgress').textContent = prog; $('#arcOpen').textContent = open;\n  document.querySelectorAll('.day-card').forEach(b => b.addEventListener('click', () => openDay(Number(b.dataset.day))));\n}\nfunction openArchive(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  buildArchive(); show('archive');\n  setTimeout(() => softFocus(document.querySelector('.day-card')), 500);\n}\nfunction goHome(){\n  clearInterval(countdownId); clearInterval(timerId);\n  if(st && !done) saveProgress();\n  paintLanding(); show('landing');\n  setTimeout(() => softFocus($('#startBtn')), 450);\n}\n\n/* ---------- Background video: keep it running, hide on failure ---------- */\nconst bgv = $('#bgVideo');\nfunction kickVideo(){\n  if(!bgv || bgv.classList.contains('failed')) return;\n  bgv.muted = true;\n  if(bgv.paused){ const p = bgv.play(); if(p && p.catch) p.catch(() => {}); }\n}\nbgv.addEventListener('error', () => bgv.classList.add('failed'), true);\n['loadedmetadata','canplay','stalled','pause'].forEach(e => bgv.addEventListener(e, kickVideo));\ndocument.addEventListener('visibilitychange', () => { if(!document.hidden) kickVideo(); });\n['pointerdown','touchstart','keydown'].forEach(e => window.addEventListener(e, kickVideo, { passive:true }));\nkickVideo();\n\n/* ---------- Keyboard / TV remote ---------- */\ndocument.addEventListener('keydown', e => {\n  const gameOn = !$('#game').classList.contains('hidden-right') && !$('#game').classList.contains('hidden-left');\n  const ae = document.activeElement;\n  const onCell = ae && ae.dataset && ae.dataset.cell !== undefined;\n  if(gameOn && !done){\n    if(/^[1-9]$/.test(e.key) && Number(e.key) \u003c= P.words.length){ selectWord(Number(e.key) - 1); return; }\n    if(e.key === 'Escape'){ sel = -1; setMsg(''); paint(); return; }\n    if((e.key === 'Backspace' || e.key === 'Delete') && onCell){\n      const ws = wordsAt(Number(ae.dataset.cell)).filter(w => !isLocked(w));\n      if(ws.length){ st.at[ws[0]] = -1; afterMove(); }\n      e.preventDefault(); return;\n    }\n  }\n  const dirs = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] };\n  const d = dirs[e.key]; if(!d) return;\n  // Move between letter squares, skipping the empty spaces\n  if(gameOn && onCell){\n    const c = Number(ae.dataset.cell);\n    let r = Math.floor(c / P.cols) + d[0], col = c % P.cols + d[1];\n    while(r >= 0 && r \u003c P.rows && col >= 0 && col \u003c P.cols){\n      const t = document.querySelector('.cell[data-cell=\"' + (r * P.cols + col) + '\"]');\n      if(t){\n        e.preventDefault();\n        try{ t.focus({ preventScroll:true }); }catch(err){ t.focus(); }\n        if(t.scrollIntoView) t.scrollIntoView({ block:'nearest', behavior:'smooth' });\n        return;\n      }\n      r += d[0]; col += d[1];\n    }\n  }\n  const list = [].slice.call(document.querySelectorAll('.screen:not(.hidden-left):not(.hidden-right) button:not(:disabled)'));\n  if(!list.length) return;\n  e.preventDefault();\n  const i = list.indexOf(ae);\n  const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';\n  const next = i === -1 ? list[0] : list[(i + (fwd ? 1 : -1) + list.length) % list.length];\n  try{ next.focus({ preventScroll:true }); }catch(err){ next.focus(); }\n  if(next.scrollIntoView) next.scrollIntoView({ block:'nearest', behavior:'smooth' });\n});\n\n/* Save the clock if the tab is closed or backgrounded mid-puzzle */\ndocument.addEventListener('visibilitychange', () => { if(document.hidden && st && !done) saveProgress(); });\nwindow.addEventListener('pagehide', () => { if(st && !done) saveProgress(); });\n\n\n/* ---------- Hub link ---------- */\nfunction toHub(){ try{ parent.postMessage({ umg:'home' }, '*'); }catch(e){} }\n$('#hubBtn').addEventListener('click', toHub);\ndocument.addEventListener('keydown', e => {\n  if(!isBackKey(e) || e.defaultPrevented) return;          // the game already used it (e.g. Backspace on a square)\n  const vis = id => { const el = document.getElementById(id); return !el.classList.contains('hidden-left') && !el.classList.contains('hidden-right'); };\n  const remoteBack = e.key !== 'Escape' && e.keyCode !== 27; // Escape mid-puzzle just deselects\n  if(vis('landing')){ e.preventDefault(); toHub(); }\n  else if(vis('archive')){ e.preventDefault(); goHome(); }\n  else if(vis('game') && (remoteBack || done)){ e.preventDefault(); goHome(); }\n});\n/* ---------- Boot ---------- */\n$('#year').textContent = today.getFullYear();\n$('#startBtn').addEventListener('click', () => openDay(todayDay));\n$('#landingArchiveBtn').addEventListener('click', () => openArchive());\n$('#landingShareBtn').addEventListener('click', shareLanding);\nbindSocial('landingLineBtn', 'landingXBtn', landingText);\n$('#arcHomeBtn').addEventListener('click', goHome);\n$('#gameHomeBtn').addEventListener('click', goHome);\n$('#hintBtn').addEventListener('click', hint);\n$('#resetBtn').addEventListener('click', clearBoard);\nfunction hideLoader(){ $('#loader').classList.add('hide'); setTimeout(() => softFocus($('#startBtn')), 400); }\ntry{ puzzleForDay(todayDay); paintLanding(); }catch(err){ console.error(err); }\nhideLoader();\n\n/* ===== LINE / X シェア ===== */\nfunction socialShare(kind, text){\n  if(!text) return;\n  var web = /^https?:$/.test(UMG_HOST.protocol);\n  var url = web ? UMG_HOST.url : '';\n  var href = kind === 'line'\n    ? 'https://line.me/R/share?text=' + encodeURIComponent(text + (url ? '\\n' + url : ''))\n    : 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : '');\n  /* 新しいタブで開く（ゲーム画面はそのまま残す） */\n  var a = document.createElement('a');\n  a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';\n  a.style.display = 'none'; document.body.appendChild(a); a.click();\n  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 0);\n}\nfunction bindSocial(lineId, xId, getText){\n  var l = document.getElementById(lineId), x = document.getElementById(xId);\n  if(l) l.addEventListener('click', function(){ socialShare('line', getText()); });\n  if(x) x.addEventListener('click', function(){ socialShare('x', getText()); });\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

    s = s === undefined ? ' ' : String(s); if(!s) return t;
    var p = ''; while(p.length < n - t.length) p += s;
    return p.slice(0, n - t.length) + t;
  };
}
if(window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;

const IS_TV = /SMART-TV|SmartTV|Tizen|Web0S|webOS|WebOS|NetCast|LG Browser|HbbTV|BRAVIA|Sony|CrKey|GoogleTV|Google TV|Android TV|AndroidTV|AFT[A-Z]|Roku|VIDAA|Viera|Panasonic|AQUOS|Sharp|PhilipsTV|Philips|TPV|Hisense|Vizio|Opera TV|OMI|Vewd|Titan|Freeview|\bTV\b/i.test(navigator.userAgent);
/* ---------- Input mode: show focus rings for remotes/keyboards, hide them for touch/mouse ---------- */
(function(){
  var root = document.documentElement;
  if(IS_TV) root.classList.add('tv', 'kbd');
  document.addEventListener('keydown', function(e){
    if(/^(Arrow|Enter|Tab|Up|Down|Left|Right)/.test(e.key || '') || (e.keyCode >= 37 && e.keyCode <= 40) || e.keyCode === 13) root.classList.add('kbd');
  }, true);
  document.addEventListener('pointerdown', function(e){ if(!IS_TV && e.pointerType) root.classList.remove('kbd'); }, true);
})();

/* Back button on every remote: Samsung Tizen (10009), LG webOS (461), Android/Fire TV, keyboards */
var BACK_KEYS = ['Escape','BrowserBack','GoBack','Back','XF86Back','Backspace'];
var BACK_CODES = [10009, 461, 166, 27, 8];
function isBackKey(e){ return BACK_KEYS.indexOf(e.key) !== -1 || BACK_CODES.indexOf(e.keyCode) !== -1; }
/* ---------- TV remotes: some TV browsers send old key names / codes; normalise them ---------- */
var KEY_ALIAS = { Left:'ArrowLeft', Up:'ArrowUp', Right:'ArrowRight', Down:'ArrowDown' };
var KEY_CODES = { 37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 13:'Enter' };
function normKey(e){
  var k = e.key;
  if(KEY_ALIAS[k]) return KEY_ALIAS[k];
  if((!k || k === 'Unidentified') && KEY_CODES[e.keyCode]) return KEY_CODES[e.keyCode];
  return null;
}
function synthKey(target, k, code){
  var ev;
  try{ ev = new KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true }); }
  catch(x){ ev = document.createEvent('Event'); ev.initEvent('keydown', true, true); try{ Object.defineProperty(ev, 'key', { get:function(){ return k; } }); }catch(y){} }
  try{ Object.defineProperty(ev, 'keyCode', { get:function(){ return code || 0; } }); }catch(x){}
  ev.umgSynthetic = true;
  (target || document.body).dispatchEvent(ev);
}

/* All remote keys go to the open game, even if the TV has put focus on this page */
window.addEventListener('keydown', function(e){
  if(e.umgSynthetic) return;
  if(e.key === 'm' || e.key === 'M'){ e.preventDefault(); toggleMusic(); return; }
  if(current && frames[current]){
    e.preventDefault(); e.stopImmediatePropagation();
    try{ frames[current].contentWindow.postMessage({ umg:'key', key:e.key, code:e.keyCode }, '*'); }catch(x){}
    focusFrame(frames[current]);
    return;
  }
  var k = normKey(e); if(!k) return;
  e.preventDefault(); e.stopImmediatePropagation();
  document.documentElement.classList.add('kbd');
  var t = document.activeElement;
  if(k === 'Enter'){ if(t && t.tagName === 'BUTTON') t.click(); return; }
  synthKey(t && t !== document.documentElement ? t : document.body, k, e.keyCode);
}, true);

const START_DATE = '2026-10-01';
const GAMES = {
  trivia:      { key:'umg.trivia.v1',      today: () => '' },
  blockbuster: { key:'umg.blockbuster.v1', today: () => '' },
  starcrossed: { key:'umg.starcrossed.ja.v1', today: () => '' },
  ladder:      { key:'umg.ladder.v1',      today: () => '' }
};
const $ = s => document.querySelector(s);
const MS_DAY = 86400000;
const toISO = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseISO = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getTime(); };
const BOOT_ISO = toISO(new Date());
let current = null, pendingReload = false;
const frames = {};

/* ---------- Status cards (read each game's saved stats) ---------- */
function readStore(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch(e){ return {}; } }
function streakOf(s){
  if(!s.lastPlayedISO) return 0;
  const y = toISO(new Date(parseISO(BOOT_ISO) - MS_DAY));
  return (s.lastPlayedISO === BOOT_ISO || s.lastPlayedISO === y) ? (s.streak || 0) : 0;
}
function paintHub(){
  $('#hubDate').textContent = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' }).format(new Date());
  let played = 0;
  Object.keys(GAMES).forEach(g => {
    const s = readStore(GAMES[g].key), res = (s.results || {})[BOOT_ISO], prog = (s.progress || {})[BOOT_ISO];
    const chip = $('#chip-' + g);
    if(res){
      played++;
      chip.className = 'chip done';
      chip.textContent = '○ ' + (g === 'trivia' ? res.correct + '／' + res.total + '問正解' : 'クリア ' + fmtTime(res.t || 0));
    }else if(prog){ chip.className = 'chip part'; chip.textContent = 'プレイ中'; }
    else{ chip.className = 'chip play'; chip.textContent = '今日はまだ'; }
    const st = streakOf(s);
    $('#streak-' + g).textContent = '\u{1F525} ' + st + '日連続';
    $('#today-' + g).textContent = todayLine(g);
  });
  const total = Object.keys(GAMES).length;
  $('#hubProgress').innerHTML = played === total ? '\u{1F3C6} 今日は<b>全ゲーム</b>をプレイしました。また明日お会いしましょう！'
    : (played ? '今日は<b>' + played + 'ゲーム</b>プレイしました。この調子で続けましょう！' : '今日のゲームを選んでください');
}
const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');

/* Small "today's feature" teasers, worked out without loading the games */
function todayLine(g){
  try{
    const day = Math.max(1, Math.round((parseISO(BOOT_ISO) - parseISO(START_DATE)) / MS_DAY) + 1);
    if(g === 'trivia') return day + '日目・今日のテーマを出題中';
    if(g === 'blockbuster') return day + '日目・新しい5×5のパズル';
    if(g === 'starcrossed') return day + '日目・今日の1本';
    if(g === 'ladder') return day + '日目・スター7人と映画6本';
  }catch(e){}
  return '';
}

/* ---------- Open / close games ---------- */
function buildSrc(g){
  let src = JSON.parse($('#src-' + g).textContent);
  const host = { protocol: location.protocol, url: location.href.split('#')[0] + '#' + g, tv: IS_TV };
  src = src.replace('/*UMG_HOST*/null', JSON.stringify(host));
  if(src.indexOf('/*MOVIES_DATA*/null') !== -1) src = src.replace('/*MOVIES_DATA*/null', $('#data-movies').textContent);
  if(src.indexOf('/*LADDER_DATA*/null') !== -1) src = src.replace('/*LADDER_DATA*/null', $('#data-ladders').textContent);
  if(src.indexOf('/*TRIVIA_DATA*/null') !== -1) src = src.replace('/*TRIVIA_DATA*/null', $('#data-trivia').textContent);
  return src;
}
function openGame(g, fromHistory){
  if(!GAMES[g]) return;
  current = g;
  if(!fromHistory){ try{ history.pushState({ game:g }, '', '#' + g); }catch(e){} }
  let f = frames[g];
  if(!f){
    f = document.createElement('iframe');
    f.className = 'frame';
    f.title = g;
    f.setAttribute('allow', 'web-share; clipboard-write; autoplay');
    $('#loader').classList.add('on');
    f.addEventListener('load', () => {
      $('#loader').classList.remove('on');
      if(current === g) focusFrame(f);
    });
    const html = buildSrc(g);
    if('srcdoc' in f) f.srcdoc = html;
    else f.src = URL.createObjectURL(new Blob([html], { type:'text/html' }));
    $('#frames').appendChild(f);
    frames[g] = f;
  }
  Object.keys(frames).forEach(k => frames[k].classList.toggle('on', k === g));
  $('#hub').classList.add('off');
  document.body.classList.add('ingame');
  focusFrame(f);
}
function focusFrame(f){ setTimeout(() => { try{ f.focus(); f.contentWindow.focus(); }catch(e){} }, 60); }
function goHub(fromHistory){
  if(pendingReload || toISO(new Date()) !== BOOT_ISO){ location.replace(location.href.split('#')[0]); return; }
  const was = current;
  current = null;
  Object.keys(frames).forEach(k => frames[k].classList.remove('on'));
  $('#hub').classList.remove('off');
  document.body.classList.remove('ingame');
  if(!fromHistory){ try{ history.pushState({}, '', location.pathname + location.search); }catch(e){} }
  paintHub();
  setTimeout(() => { const c = was ? $('.gcard[data-game="' + was + '"]') : $('.gcard'); if(c) try{ c.focus({ preventScroll:true }); }catch(e){} }, 120);
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if(d.umg === 'home') goHub();
  else if(d.umg === 'gesture'){ startMusic(); kickVideo(); }
  else if(d.umg === 'music') toggleMusic();
});
window.addEventListener('popstate', e => {
  const g = (e.state && e.state.game) || location.hash.slice(1);
  if(GAMES[g]) openGame(g, true); else goHub(true);
});
document.querySelectorAll('.gcard').forEach(b => b.addEventListener('click', () => openGame(b.dataset.game)));

/* ---------- Keyboard / TV remote on the hub ---------- */
document.addEventListener('keydown', e => {
  if(current){
    // Focus slipped out of the game (common on TVs): Back returns to the menu, anything else hands focus back
    if(isBackKey(e)){ e.preventDefault(); goHub(); }
    else if(frames[current]) focusFrame(frames[current]);
    return;
  }
  if(e.key === 'Enter' && document.activeElement && document.activeElement.classList && (document.activeElement.classList.contains('gcard') || document.activeElement.classList.contains('unext'))) return;
  const cards = [].slice.call(document.querySelectorAll('.gcard, .unext, #musicBtn:not(.gone)'));
  const i = cards.indexOf(document.activeElement);
  const fwd = e.key === 'ArrowRight' || e.key === 'ArrowDown', back = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
  if(!fwd && !back) return;
  e.preventDefault();
  const n = i === -1 ? cards[0] : cards[(i + (fwd ? 1 : -1) + cards.length) % cards.length];
  try{ n.focus({ preventScroll:true }); }catch(err){ n.focus(); }
  if(n.scrollIntoView) n.scrollIntoView({ block:'nearest', behavior:'smooth' });
});

/* ---------- New day: refresh everything at local midnight ---------- */
setInterval(() => {
  if(toISO(new Date()) === BOOT_ISO) return;
  if(!current || document.hidden) location.replace(location.href.split('#')[0]);
  else pendingReload = true;
}, 30000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && toISO(new Date()) !== BOOT_ISO && !current) location.replace(location.href.split('#')[0]);
});

/* ---------- Background video: keep it running, hide on failure ---------- */
const bgv = $('#bgVideo');
bgv.muted = true; bgv.defaultMuted = true; bgv.setAttribute('muted', '');
function kickVideo(){
  if(!bgv || bgv.classList.contains('failed')) return;
  bgv.muted = true;
  if(bgv.paused){ const p = bgv.play(); if(p && p.catch) p.catch(() => {}); }
}
bgv.addEventListener('error', () => bgv.classList.add('failed'), true);
['loadedmetadata','canplay','stalled','pause'].forEach(ev => bgv.addEventListener(ev, kickVideo));
document.addEventListener('visibilitychange', () => { if(!document.hidden) kickVideo(); });
['pointerdown','touchstart','keydown'].forEach(ev => window.addEventListener(ev, kickVideo, { passive:true }));
window.addEventListener('focus', kickVideo);
kickVideo();


/* ---------- Background music (background_music.mp3) ----------
   Tries to start straight away; browsers that block sound until the first
   tap/key press start it then (including presses inside a game). */
const bgm = $('#bgm'), mBtn = $('#musicBtn');
const MUSIC_KEY = 'umg.music';
let musicOn = (function(){ try{ return localStorage.getItem(MUSIC_KEY) !== 'off'; }catch(e){ return true; } })();
let hasMusic = true;
bgm.volume = 0.35;
function paintMusic(){
  mBtn.classList.toggle('muted', !musicOn);
  mBtn.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
  mBtn.setAttribute('aria-label', musicOn ? 'BGMをオフにする' : 'BGMをオンにする');
  mBtn.title = (musicOn ? 'BGM オン' : 'BGM オフ') + '（Mキー）';
}
function startMusic(){
  if(!hasMusic || !musicOn || !bgm.paused || document.hidden) return;
  const p = bgm.play(); if(p && p.catch) p.catch(() => {});
}
function toggleMusic(){
  if(!hasMusic) return;
  musicOn = !musicOn;
  try{ localStorage.setItem(MUSIC_KEY, musicOn ? 'on' : 'off'); }catch(e){}
  if(musicOn) startMusic(); else bgm.pause();
  paintMusic();
}
function noMusic(){ hasMusic = false; bgm.pause(); mBtn.classList.add('gone'); }
bgm.addEventListener('error', noMusic, true);
bgm.querySelector('source').addEventListener('error', noMusic);
mBtn.addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });
['pointerdown','touchstart','keydown','click'].forEach(ev => window.addEventListener(ev, e => {
  if(e.target === mBtn || (mBtn.contains && mBtn.contains(e.target))) return;
  startMusic();
}, { passive:true }));
document.addEventListener('visibilitychange', () => { if(document.hidden) bgm.pause(); else startMusic(); });
paintMusic();
startMusic();

/* ---------- Boot ---------- */
$('#year').textContent = new Date().getFullYear();
paintHub();
const startGame = location.hash.slice(1);
if(GAMES[startGame]){ try{ history.replaceState({ game:startGame }, '', '#' + startGame); }catch(e){} openGame(startGame, true); }
else setTimeout(() => { if(IS_TV || !('ontouchstart' in window)) try{ $('.gcard').focus({ preventScroll:true }); }catch(e){} }, 300);
</script>
</body>
